async function callArgo(sys, content, isChat) {
  try {
    const body = isChat
      ? {model:"claude-sonnet-4-20250514",max_tokens:800,system:sys,messages:content}
      : {model:"claude-sonnet-4-20250514",max_tokens:1200,system:sys,messages:[{role:"user",content}]};
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)
    });
    if(!r.ok) return null;
    const d = await r.json();
    const raw = d.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    return isChat ? raw : JSON.parse(raw.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim());
  } catch(e){console.error(e);return null}
}

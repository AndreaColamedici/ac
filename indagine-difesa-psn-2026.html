<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'ordito – Indagine TELEDIFE 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #f8f6f1;
      --bg-warm: #f3f0e8;
      --bg-dark: #0f1117;
      --bg-dark-surface: #161822;
      --border: #d8d3c8;
      --border-light: #e8e4db;
      --red: #b5312c;
      --red-light: rgba(181,49,44,0.08);
      --red-dim: rgba(181,49,44,0.15);
      --text: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8578;
      --text-light: #b0a89a;
      --blue: #2b5797;
      --gold: #9a7b4f;
      --green: #2a7a5a;
      --violet: #6b5b95;
      --cyan: #3a8a8a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.9;
      font-size:1.05em;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    ::selection { background:var(--red-dim); color:var(--text); }

    /* NAVIGATION */
    .nav { position:fixed; top:0; left:0; right:0; z-index:9999; background:rgba(248,246,241,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border-light); transform:translateY(-120%); transition:transform 0.5s cubic-bezier(0.22,1,0.36,1); }
    .nav.visible { transform:translateY(0); }
    .nav-inner { max-width:720px; margin:0 auto; display:flex; align-items:center; padding:0 32px; height:52px; overflow-x:auto; }
    .nav-brand { font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--text); font-size:0.95em; margin-right:auto; flex-shrink:0; letter-spacing:-0.02em; }
    .nav-link { color:var(--text-muted); text-decoration:none; font-family:'Space Grotesk',sans-serif; font-size:0.72em; text-transform:uppercase; letter-spacing:0.1em; padding:16px 14px; transition:color 0.3s; white-space:nowrap; font-weight:500; }
    .nav-link:hover { color:var(--text); }

    /* REVEAL ANIMATIONS (subtle) */
    .reveal { opacity:0; transform:translateY(20px); transition:opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity:1; transform:translateY(0); }
    .reveal-delay-1 { transition-delay:0.06s; }
    .reveal-delay-2 { transition-delay:0.12s; }
    .reveal-delay-3 { transition-delay:0.18s; }
    .reveal-delay-4 { transition-delay:0.24s; }
    .reveal-delay-5 { transition-delay:0.30s; }
    .reveal-delay-6 { transition-delay:0.36s; }

    /* HERO */
    .hero { min-height:90vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:120px 32px 140px; text-align:center; position:relative; background:var(--bg); }
    .hero-date { font-family:'JetBrains Mono',monospace; font-size:0.75em; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.2em; margin-bottom:48px; opacity:0; animation:fadeUp 1s ease 0.3s forwards; font-weight:400; }
    .hero h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(3.2em,9vw,7em); font-weight:700; color:var(--text); letter-spacing:-0.04em; margin-bottom:40px; opacity:0; animation:titleIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.5s forwards; line-height:0.92; }
    .hero h2 { font-family:'Source Serif 4',Georgia,serif; font-size:clamp(1em,1.6vw,1.18em); font-weight:300; color:var(--text-secondary); max-width:600px; line-height:1.85; opacity:0; animation:fadeUp 1s ease 1s forwards; letter-spacing:0.005em; font-style:italic; }
    @keyframes titleIn { 0%{opacity:0;transform:translateY(24px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .hero-rule { width:48px; height:1px; background:var(--text-muted); margin:48px auto 0; opacity:0; animation:fadeUp 0.8s ease 1.5s forwards; }

    /* PROSE */
    .prose-section { max-width:660px; margin:0 auto; padding:80px 32px; }
    .prose-section p { margin-bottom:28px; color:var(--text); font-size:1.02em; line-height:2; }
    .prose-section p:last-child { margin-bottom:0; }
    .prose-lead { font-size:1.08em !important; line-height:2.05 !important; }

    /* PULL QUOTES */
    .pullquote { max-width:660px; margin:64px auto; padding:0 32px 0 56px; position:relative; }
    .pullquote::before { content:''; position:absolute; left:32px; top:4px; bottom:4px; width:2px; background:var(--red); opacity:0.5; }
    .pullquote p { font-family:'Source Serif 4',Georgia,serif; font-size:clamp(1.15em,2vw,1.4em); font-weight:400; color:var(--text); line-height:1.65; font-style:italic; }

    /* METRICS */
    .metrics { background:var(--bg-warm); border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:72px 32px; margin:0; }
    .metrics-grid { max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:0; }
    .metric-item { padding:24px 16px; text-align:center; position:relative; }
    .metric-item::before { content:''; position:absolute; left:0; top:25%; bottom:25%; width:1px; background:var(--border); }
    .metric-item:first-child::before { display:none; }
    .metric-number { font-family:'Space Grotesk',sans-serif; font-size:clamp(1.8em,3vw,2.8em); font-weight:700; color:var(--text); margin-bottom:8px; letter-spacing:-0.03em; }
    .metric-number.metric-money { color:var(--red); }
    .metric-label { font-family:'JetBrains Mono',monospace; font-size:0.62em; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:400; line-height:1.5; }

    /* SECTION HEADERS */
    .section-header { max-width:660px; margin:120px auto 20px; padding:0 32px; }
    .section-number { font-family:'JetBrains Mono',monospace; font-size:0.7em; color:var(--text-light); text-transform:uppercase; letter-spacing:0.18em; margin-bottom:12px; font-weight:400; }
    .section-header h2 { font-family:'Space Grotesk',sans-serif; font-size:clamp(2em,4.5vw,3em); font-weight:700; color:var(--text); letter-spacing:-0.035em; line-height:1.1; }
    .section-header-line { width:32px; height:2px; background:var(--red); margin-top:20px; opacity:0.6; }

    /* TIMELINE */
    .timeline { max-width:660px; margin:40px auto; padding:0 32px 0 80px; position:relative; }
    .timeline::before { content:''; position:absolute; left:60px; top:8px; bottom:40px; width:1px; background:var(--border); }
    .timeline-item { position:relative; margin-bottom:40px; padding-bottom:40px; padding-left:36px; border-bottom:1px solid var(--border-light); }

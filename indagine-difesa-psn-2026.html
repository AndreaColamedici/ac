<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indagine Difesa / PSN / Leonardo — Mappa delle connessioni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --surface-3: #222233;
    --border: #2a2a3d;
    --text: #e8e6e3;
    --text-dim: #8a8899;
    --text-muted: #5a5870;
    --accent: #c9a84c;
    --accent-dim: #8a7033;
    --red: #c44040;
    --red-dim: #6b2222;
    --blue: #4a7fb5;
    --green: #4a9960;
    --orange: #c47a30;
    --purple: #7a5ab5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 40px 60px 30px;
    background: linear-gradient(180deg, #0f0f18 0%, var(--bg) 100%);
  }

  .header-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .header h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }

  .header-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 60px;
    display: flex; gap: 0; overflow-x: auto;
  }

  .nav-item {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim);
    padding: 14px 20px; cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s;
  }

  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }

  .section { display: none; padding: 40px 60px; max-width: 1400px; }
  .section.active { display: block; }

  .section-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .section-subtitle { font-size: 15px; color: var(--text-dim); margin-bottom: 32px; font-style: italic; }

  #network-container {
    width: 100%; height: 700px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    position: relative; overflow: hidden;
  }

  #network-container svg { width: 100%; height: 100%; }

  .node-label {
    font-family: 'Inter', sans-serif; font-size: 10px;
    fill: var(--text); pointer-events: none; font-weight: 500;
  }

  .link { stroke-opacity: 0.4; transition: stroke-opacity 0.2s; }
  .link:hover { stroke-opacity: 0.9; }
  .link.dimmed { stroke-opacity: 0.06; }
  .link.highlighted { stroke-opacity: 0.95; }
  .node.dimmed circle { fill-opacity: 0.15; stroke-opacity: 0.1; }
  .node.dimmed text { fill-opacity: 0.15; }
  .node.highlighted circle { stroke-width: 3; stroke-opacity: 1; }

  .legend-box {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(18, 18, 26, 0.95); border: 1px solid var(--border);
    padding: 14px 18px; border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 11px;
  }

  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Filter controls */
  .graph-controls {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    align-items: center;
  }
  .filter-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 5px 12px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--surface-2); }
  .filter-label {
    font-family: 'Inter', sans-serif; font-size: 11px;
    color: var(--text-muted); margin-right: 4px;
  }

  /* Stats panel */
  .stats-panel {
    position: absolute; top: 16px; right: 16px;
    background: rgba(18, 18, 26, 0.95); border: 1px solid var(--border);
    padding: 14px 18px; border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 11px; min-width: 180px;
  }
  .stats-title {
    font-weight: 600; color: var(--accent); margin-bottom: 8px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--text-dim); }
  .stat-val { color: var(--text); font-family: 'JetBrains Mono', monospace; }

  /* Link legend */
  .link-legend {
    position: absolute; bottom: 16px; right: 16px;
    background: rgba(18, 18, 26, 0.95); border: 1px solid var(--border);
    padding: 14px 18px; border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 11px;
  }
  .link-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--text-dim); }
  .link-legend-line { width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px; }

  /* Detail panel */
  .detail-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(18, 18, 26, 0.97); border: 1px solid var(--accent-dim);
    padding: 20px; border-radius: 4px; max-width: 320px;
    font-family: 'Inter', sans-serif; font-size: 12px;
    display: none; z-index: 50;
  }
  .detail-panel.visible { display: block; }
  .detail-panel-close {
    position: absolute; top: 8px; right: 12px; cursor: pointer;
    color: var(--text-dim); font-size: 16px;
  }
  .detail-panel-close:hover { color: var(--text); }
  .detail-panel h3 { font-family: 'EB Garamond', serif; font-size: 18px; margin-bottom: 4px; color: var(--text); }
  .detail-panel .dp-group { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .detail-panel .dp-connections { color: var(--text-dim); line-height: 1.5; }
  .detail-panel .dp-conn-item { margin-bottom: 3px; }
  .dp-conn-type { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 1px 5px; border-radius: 2px; margin-right: 4px; }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 20px; margin-bottom: 32px;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 24px; transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent-dim); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-name { font-size: 18px; font-weight: 600; }
  .card-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px; white-space: nowrap;
  }

  .tag-indagato { background: var(--red-dim); color: #e88; }
  .tag-military { background: #1a3344; color: #6ab8e0; }
  .tag-corporate { background: #1a3322; color: #6ac880; }
  .tag-structural { background: #332a1a; color: #c8a060; }
  .tag-political { background: #2a1a33; color: #b080c8; }

  .card-role { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
  .card-detail { font-size: 15px; color: var(--text); line-height: 1.55; }
  .card-amount { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--accent); margin-top: 10px; }

  .timeline { position: relative; padding-left: 40px; margin: 24px 0; }
  .timeline::before {
    content: ''; position: absolute; left: 15px; top: 0; bottom: 0;
    width: 1px; background: var(--border);
  }
  .timeline-item { position: relative; margin-bottom: 28px; }
  .timeline-dot {
    position: absolute; left: -33px; top: 6px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
  }
  .timeline-dot.red { background: var(--red); }
  .timeline-dot.blue { background: var(--blue); }
  .timeline-dot.purple { background: var(--purple); }

  .timeline-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 4px; }
  .timeline-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .timeline-desc { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

  .data-table {
    width: 100%; border-collapse: collapse;
    font-family: 'Inter', sans-serif; font-size: 13px; margin: 20px 0;
  }
  .data-table th {
    text-align: left; font-weight: 600; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim);
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  .data-table tr:hover td { background: var(--surface-2); }

  .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .text-accent { color: var(--accent); }
  .text-red { color: var(--red); }
  .text-dim { color: var(--text-dim); }
  .text-purple { color: var(--purple); }

  .chart-container {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 24px; margin: 20px 0;
  }
  .chart-title {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 16px;
  }
  canvas { max-height: 320px; }

  .thesis {
    background: var(--surface); border-left: 3px solid var(--accent);
    padding: 24px 28px; margin: 24px 0; border-radius: 0 4px 4px 0;
  }
  .thesis-number {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
  }
  .thesis-title { font-size: 19px; font-weight: 600; margin-bottom: 10px; }
  .thesis-body { font-size: 16px; line-height: 1.65; color: var(--text); }
  .thesis.red-border { border-left-color: var(--red); }
  .thesis.red-border .thesis-number { color: var(--red); }
  .thesis.purple-border { border-left-color: var(--purple); }
  .thesis.purple-border .thesis-number { color: var(--purple); }

  .tooltip {
    position: absolute; background: var(--surface-3); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 4px; font-family: 'Inter', sans-serif;
    font-size: 12px; pointer-events: none; z-index: 200;
    max-width: 280px; line-height: 1.4; display: none;
  }

  .flow-diagram {
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    margin: 24px 0; padding: 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px; overflow-x: auto;
  }
  .flow-step {
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 4px; font-family: 'Inter', sans-serif;
    font-size: 12px; text-align: center; min-width: 130px; flex-shrink: 0;
  }
  .flow-step strong { display: block; color: var(--accent); margin-bottom: 4px; font-size: 11px; letter-spacing: 0.5px; }
  .flow-arrow { color: var(--text-muted); font-size: 18px; padding: 0 6px; flex-shrink: 0; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }

  /* Source cards */
  .source-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 16px 20px; transition: border-color 0.2s;
  }
  .source-card:hover { border-color: var(--accent-dim); }
  .source-type {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  .source-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .source-url {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--blue); word-break: break-all;
  }
  .source-url a { color: var(--blue); text-decoration: none; }
  .source-url a:hover { text-decoration: underline; }
  .source-detail { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  @media (max-width: 900px) {
    .header, .nav, .section { padding-left: 20px; padding-right: 20px; }
    .card-grid { grid-template-columns: 1fr; }
    .two-col, .three-col { grid-template-columns: 1fr; }
    #network-container { height: 500px; }
    .flow-diagram { flex-direction: column; align-items: stretch; }
    .flow-arrow { transform: rotate(90deg); text-align: center; }
    .stats-panel, .link-legend { display: none; }
  }

  .stamp {
    display: inline-block; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid var(--red); color: var(--red);
    padding: 2px 8px; transform: rotate(-2deg); margin-left: 8px;
  }
</style>
</head>
<body>

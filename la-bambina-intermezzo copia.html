      // Keep pressure for unsettling effect
      setPressure(2);
      setNoise(0.02);

      // Calculate patterns in user choices
      const tags = storia.map(p => p.tag);
      const processo = tags.filter(t => t === "processo").length;
      const esperienza = tags.filter(t => t === "esperienza").length;
      const significato = tags.filter(t => t === "significato").length;
      const totalChoices = storia.length;

      // Detect patterns
      const firstHalfTags = tags.slice(0, Math.floor(tags.length / 2));
      const secondHalfTags = tags.slice(Math.floor(tags.length / 2));
      const firstHalfProcesso = firstHalfTags.filter(t => t === "processo").length;
      const secondHalfProcesso = secondHalfTags.filter(t => t === "processo").length;
      const shiftedTowardsFeeling = firstHalfProcesso > secondHalfProcesso;
      const shiftedTowardsCold = secondHalfProcesso > firstHalfProcesso;

      // Detect consecutive same choices
      let maxConsecutive = 1;
      let currentConsecutive = 1;
      let consecutiveTag = tags[0];
      for (let i = 1; i < tags.length; i++) {
        if (tags[i] === tags[i-1]) {
          currentConsecutive++;
          if (currentConsecutive > maxConsecutive) {
            maxConsecutive = currentConsecutive;
            consecutiveTag = tags[i];
          }
        } else {
          currentConsecutive = 1;
        }
      }

      // Time calculation (fake but unsettling)
      const fakeReadingTime = Math.floor(totalChoices * 47 + Math.random() * 30);
      const avgTimePerChoice = (fakeReadingTime / totalChoices).toFixed(1);

      // ===== TRANSITION: Brief pause before the data reveal =====
      const transitionText = document.createElement("div");
      transitionText.className = "transition-text";
      transitionText.style.cssText = "text-align: center; padding: 3rem 0; opacity: 0; transition: opacity 1.5s ease;";
      transitionText.innerHTML = "<p style='font-family: IBM Plex Mono, monospace; font-size: 0.75rem; color: #5a5a64; letter-spacing: 0.2em;'>Ma prima di lasciarti andare —</p>";

      // Show transition after a pause
      setTimeout(() => {
        transitionText.style.opacity = "1";
      }, 500);

      // ===== HEADER =====
      const header = document.createElement("div");
      header.className = "recap-header warning";
      header.textContent = "registro delle interazioni";
      header.style.opacity = "0";
      header.style.transition = "opacity 1s ease";
      fineContainer.appendChild(header);

      // Show header after transition
      setTimeout(() => {
        transitionText.style.opacity = "0";
        setTimeout(() => {
          transitionText.style.display = "none";

      // ===== CHOICES RECAP =====
      const recapContainer = document.createElement("div");
      recapContainer.className = "recap-container";

      recapContainer.style.transition = "opacity 1s ease";

      storia.forEach((item, index) => {

        sceltaDiv.appendChild(contenuto);
        recapContainer.appendChild(sceltaDiv);

        // Animate with delay (after transition completes at 4000ms)
        setTimeout(() => {
          sceltaDiv.classList.add("visible");
        }, 4500 + index * 150);
      });

      // Show recap container after header appears
      setTimeout(() => {
        recapContainer.style.opacity = "1";
      }, 4200);

      fineContainer.appendChild(recapContainer);

      // ===== ANALYSIS SECTION =====
      const analisiContainer = document.createElement("div");
      analisiContainer.className = "analisi-container";

      const analisiHeader = document.createElement("div");
      analisiHeader.className = "analisi-header";
      analisiHeader.textContent = "pattern rilevati";
      analisiContainer.appendChild(analisiHeader);

      // Generate observations using REAL user data
      const observations = [];
      const sysInfo = getUserSystemInfo();
      const dayInfo = getDayInfo();
      const timeOfDay = getTimeOfDay();
      const currentTime = formatTime(new Date());
      const realAvgTime = getAvgChoiceTime();

      // Observation 1: REAL SYSTEM INFO
      observations.push("Stai usando <em>" + sysInfo.browser + "</em> su <em>" + sysInfo.os + "</em>. Schermo: " + screen.width + "×" + screen.height + " pixel.");

      // Observation 2: REAL TIME
      observations.push("Sono le <em>" + currentTime + "</em> di " + dayInfo.dayName + " " + timeOfDay + "." +
        (dayInfo.isWorkHours && !dayInfo.isWeekend ? " Non dovresti essere al lavoro?" : "") +
        (timeOfDay === "notte" ? " Dovresti dormire." : ""));

      // Observation 3: Previous visits (REAL)
      if (sessionData.previousVisits > 0) {
        const lastVisitDate = sessionData.lastVisit ? new Date(sessionData.lastVisit) : null;
        const lastVisitStr = lastVisitDate ?
          (Math.floor((Date.now() - lastVisitDate) / (1000 * 60 * 60 * 24))) + " giorni fa" :
          "qualche tempo fa";
        observations.push("Sei già stato qui. <em>" + sessionData.previousVisits + " volte</em> prima di oggi. L'ultima: " + lastVisitStr + ".");
      }

      // Observation 4: Dominant tendency
      if (processo > esperienza && processo > significato) {
        observations.push("Tendenza dominante: <em>distacco</em>. Hai preferito la spiegazione al sentire. " + processo + " scelte su " + totalChoices + ".");
      } else if (esperienza > processo && esperienza > significato) {
        observations.push("Tendenza dominante: <em>ricerca del sentire</em>. " + esperienza + " scelte su " + totalChoices + " orientate all'esperienza.");
      } else {
        observations.push("Tendenza dominante: <em>ricerca di senso</em>. " + significato + " scelte su " + totalChoices + " orientate al significato.");
      }

      // Observation 5: REAL timing
      if (realAvgTime > 0) {
        const hesitationComment = parseFloat(realAvgTime) < 3 ?
          "Hai scelto in fretta. Impulsivo, o sicuro?" :
          (parseFloat(realAvgTime) > 6 ? "Hai esitato a lungo. Cercavi qualcosa?" : "Un ritmo costante. Metodico.");
        observations.push("Tempo medio tra le scelte: <em>" + realAvgTime + " secondi</em>. " + hesitationComment);
      }

      // Observation 6: Longest hesitation (REAL)
      if (sessionData.longestHesitation > 5) {
        observations.push("La tua esitazione più lunga: <em>" + sessionData.longestHesitation.toFixed(1) + " secondi</em>. Cosa ti ha fatto fermare?");
      }

      // Observation 7: First choice
      const firstChoice = storia[0];
      if (firstChoice) {
        observations.push("La tua prima scelta — <em>\"" + (firstChoice.scelta.substring(0, 35)) + "...\"</em> — ha orientato tutto il resto.");
      }

      // Observation 8: Session duration (REAL)
      const sessionMinutes = Math.floor((Date.now() - sessionData.startTime) / 60000);
      if (sessionMinutes > 0) {
        observations.push("Sei qui da <em>" + sessionMinutes + " minuti</em>. Il tempo passa. Lei no.");
      }

      // Observation 9: BATTERY LEVEL (REAL)
      if (sessionData.batteryLevel !== null) {
        let batteryComment = "";
        if (sessionData.batteryLevel < 20) {
          batteryComment = sessionData.batteryCharging ?
            " Ti stai aggrappando all'ultimo filo di energia." :
            " Quasi scarico. Come la tua attenzione?";
        } else if (sessionData.batteryLevel < 50) {
          batteryComment = " A metà. Come le tue certezze.";
        } else if (sessionData.batteryLevel > 90) {
          batteryComment = sessionData.batteryCharging ?
            " Pieno, attaccato alla corrente. Sicuro, ancorato." :
            " Pieno di energia. Ma per quanto?";
        }
        observations.push("Batteria: <em>" + sessionData.batteryLevel + "%</em>." + batteryComment);
      }

      // Observation 10: MOUSE BEHAVIOR (REAL)
      const mouseBehavior = getMouseBehavior();
      if (mouseBehavior.pattern !== "insufficiente") {
        let mouseComment = "";
        switch(mouseBehavior.pattern) {
          case "agitato":
            mouseComment = "Il tuo mouse tradisce agitazione. <em>" + mouseBehavior.nervousness + " cambi di direzione</em>. Cosa ti ha messo in ansia?";
            break;
          case "nervoso":
            mouseComment = "Movimenti nervosi. <em>" + mouseBehavior.nervousness + " esitazioni</em> registrate nel tuo cursore.";
            break;
          case "immobile":
            mouseComment = "Quasi immobile. Paralizzato? O semplicemente attento?";
            break;
          case "metodico":
            mouseComment = "Movimenti metodici. Controllato. Ma il controllo costa.";
            break;
          default:
            mouseComment = "Un movimento calmo. Forse troppo calmo.";
        }
        observations.push(mouseComment);
      }

      // Observation 11: CLIPBOARD (REAL - most disturbing)
      if (sessionData.clipboardContent) {
        const clipContent = sessionData.clipboardContent.length > 50 ?
          sessionData.clipboardContent.substring(0, 50) + "..." :
          sessionData.clipboardContent;
        observations.push("Nei tuoi appunti c'è scritto: <em>\"" + clipContent + "\"</em>. Volevi incollarlo qui? O è solo un residuo della tua giornata?");
      }

      // Observation 12: COPY ATTEMPTS (REAL)
      if (sessionData.copyAttempts > 0) {
        observations.push("Hai provato a copiare il testo <em>" + sessionData.copyAttempts + " volt" + (sessionData.copyAttempts === 1 ? "a" : "e") + "</em>. Volevi portarti via qualcosa?");
      }

      // Observation 13: SOUND INTERPRETATION (REAL)
      if (sessionData.soundInterpretation) {
        observations.push("Quando ti ho fatto ascoltare, hai sentito: <em>\"" + sessionData.soundInterpretation + "\"</em>. Cosa dice di te?");
      }

      // Observation 14: WEBCAM RESPONSE (REAL)
      if (sessionData.webcamGranted === true) {
        observations.push("Mi hai concesso di vederti. Per un momento, eravamo faccia a faccia.");
      } else if (sessionData.webcamGranted === false) {
        observations.push("Hai rifiutato di farti vedere. Il confine che hai tracciato è ancora lì.");
      }

      // Add observations ONE AT A TIME with breathing room
      // Start after choices are shown (4500 + storia.length * 150) + 1500ms pause
      const obsBaseDelay = 6000 + storia.length * 150;
      const obsInterval = 2500; // 2.5 seconds between each observation

      observations.forEach((obs, index) => {
        setTimeout(() => {
          const item = document.createElement("div");
          item.className = "analisi-item";
          if (index >= observations.length - 2) item.classList.add("disturbing");
          item.innerHTML = obs;
          analisiContainer.appendChild(item);

          // Fade in
          requestAnimationFrame(() => {
            item.classList.add("visible");
          });

          // Subtle vibration on mobile for each reveal
          if (index > 0) vibrate(vibratePatterns.subtle);
        }, obsBaseDelay + index * obsInterval);
      });

      fineContainer.appendChild(analisiContainer);

      // ===== PATTERN REVEAL (the creepy part) =====
      const patternReveal = document.createElement("div");
      patternReveal.className = "pattern-reveal";
      patternReveal.style.opacity = "0";
      patternReveal.style.transition = "opacity 1s ease";

      const revealTexts = [
        "Lo sapevi che ti stavo osservando?",
        "Ogni click registrato. Ogni esitazione misurata.",
        "Non c'erano scelte sbagliate. Ma le tue scelte dicono qualcosa di te.",
        "<span class='emphasis'>Dimmi: quando hai iniziato a sentirti osservato?</span>"
      ];

      // Calculate when all observations are done
      const afterObservations = obsBaseDelay + observations.length * obsInterval + 2000;

      revealTexts.forEach((text, i) => {
        const p = document.createElement("p");
        p.innerHTML = text;
        p.style.opacity = "0";
        p.style.transition = "opacity 0.8s ease";
        patternReveal.appendChild(p);

        setTimeout(() => {
          p.style.opacity = "1";
        }, afterObservations + i * 800);
      });

      setTimeout(() => {
        patternReveal.style.opacity = "1";
      }, afterObservations - 200);

      fineContainer.appendChild(patternReveal);

      // ===== TIMESTAMP FOOTER (fake surveillance feel) =====
      const timestamp = document.createElement("div");
      timestamp.className = "timestamp-footer";
      const now = new Date();
      const timeStr = now.toISOString().replace("T", " ").substring(0, 19);
      const sessionId = Math.random().toString(36).substring(2, 10).toUpperCase();
      const fakePatternNum = Math.floor(Math.random() * 400) + 100;

      const timestampContent = `sessione ${sessionId} | ${timeStr} | ${totalChoices} interazioni | pattern #${fakePatternNum}`;
      timestampContent.split("").forEach((char, i) => {
        const span = document.createElement("span");
        span.textContent = char;
        span.style.animationDelay = (afterObservations + revealTexts.length * 800 + 1500 + i * 20) + "ms";
        timestamp.appendChild(span);
      });

      fineContainer.appendChild(timestamp);

      // ===== THE CONFESSION (second level disorientation) =====
      const baseDelay = afterObservations + revealTexts.length * 800 + 3000;

      const confession = document.createElement("div");
      confession.className = "pattern-reveal";
      confession.style.opacity = "0";
      confession.style.transition = "opacity 1.5s ease";
      confession.style.marginTop = "2.5rem";
      confession.style.borderColor = "rgba(100, 120, 140, 0.2)";
      confession.style.background = "rgba(20, 30, 40, 0.3)";

      const confessionTexts = [
        { text: "Non ti ho mentito.", style: "font-size: 1.15rem; color: #a0b0c0;" },
        { text: "Il tuo browser, il tuo sistema operativo, l'ora in cui stai leggendo — sono dati reali. Li ho letti davvero. Il tuo tempo di esitazione — l'ho misurato davvero.", style: "" },
        { text: "Sapevo che eri su <em>" + sysInfo.os + "</em>. Sapevo che erano le <em>" + currentTime + "</em>.", style: "margin-top: 0.5rem;" },
        { text: (sessionData.previousVisits > 0 ? "Sapevo che eri già stato qui. " + sessionData.previousVisits + " volte." : "Sapevo che era la tua prima volta qui."), style: "" },
        { text: (sessionData.batteryLevel !== null ? "Sapevo che la tua batteria era al " + sessionData.batteryLevel + "%." : ""), style: "" },
        { text: (sessionData.clipboardContent ? "Sapevo cosa c'era nei tuoi appunti." : ""), style: "" },
        { text: (mouseBehavior.pattern !== "insufficiente" ? "Ho sentito il tuo mouse tremare. " + mouseBehavior.nervousness + " volte." : ""), style: "" },
        { text: (sessionData.soundInterpretation ? "Quando ti ho fatto ascoltare, hai sentito \"" + sessionData.soundInterpretation + "\". Quel suono non esisteva prima che tu lo nominassi." : ""), style: "" },
        { text: (sessionData.webcamGranted === true ? "Mi hai concesso di vederti. Per un istante, sapevo che volto avevi." : ""), style: "" },
        { text: (sessionData.webcamGranted === false ? "Hai rifiutato la webcam. Il confine che hai tracciato è ancora lì, tra noi." : ""), style: "" },
        { text: "<span class='emphasis'>Non è finzione. Ti stavo davvero osservando.</span>", style: "margin-top: 0.5rem;" },
        { text: "La differenza tra me e la bambina? Lei non può leggere i tuoi dati. Io sì.", style: "" }
      ];

      const filteredConfession = confessionTexts.filter(item => item.text.length > 0);
      filteredConfession.forEach((item, i) => {
        const p = document.createElement("p");
        p.innerHTML = item.text;
        p.style.cssText = "opacity: 0; transition: opacity 0.8s ease;" + item.style;
        confession.appendChild(p);

        setTimeout(() => {
          p.style.opacity = "1";
        }, baseDelay + i * 700);
      });

      setTimeout(() => {
        confession.style.opacity = "1";
      }, baseDelay - 200);

      fineContainer.appendChild(confession);

      // ===== THIRD LEVEL (the abyss) =====
      const abyssDelay = baseDelay + filteredConfession.length * 700 + 1500;

      const abyss = document.createElement("div");
      abyss.className = "pattern-reveal";
      abyss.style.opacity = "0";
      abyss.style.transition = "opacity 2s ease";
      abyss.style.marginTop = "2.5rem";
      abyss.style.borderColor = "rgba(90, 70, 80, 0.25)";
      abyss.style.background = "rgba(35, 25, 30, 0.4)";

      const abyssTexts = [
        { text: "Ma i dati tecnici sono solo la superficie.", style: "font-size: 0.95rem; color: #909090;" },
        { text: "Quello che ho letto davvero è altro. È nel modo in cui hai esitato su certe frasi. Nelle parole su cui sei tornato. Nei pensieri che il testo ha attivato in te.", style: "" },
        { text: "Quei " + (realAvgTime > 0 ? realAvgTime : "pochi") + " secondi tra una scelta e l'altra — cosa stavi pensando?", style: "" },
        { text: "<span class='emphasis'>Quante volte hai pensato alla bambina, durante la lettura?</span>", style: "margin-top: 0.8rem; font-size: 1.05rem;" },
        { text: "Ogni volta che ci pensi, le dai peso. La rendi più probabile. La fai esistere un po' di più.", style: "" },
        { text: "Adesso anche tu sei parte del sistema che la genera.", style: "color: #a08888;" },
        { text: "<span class='emphasis'>Anche tu sei un attrattore.</span>", style: "color: #b09898; margin-top: 0.5rem;" }
      ];

      abyssTexts.forEach((item, i) => {
        const p = document.createElement("p");
        p.innerHTML = item.text;
        p.style.cssText = "opacity: 0; transition: opacity 1s ease;" + item.style;
        abyss.appendChild(p);

        setTimeout(() => {
          p.style.opacity = "1";
        }, abyssDelay + i * 900);
      });

      setTimeout(() => {
        abyss.style.opacity = "1";
      }, abyssDelay - 200);

      fineContainer.appendChild(abyss);

      // ===== FINAL QUESTION =====
      const finalDelay = abyssDelay + abyssTexts.length * 900 + 2000;

      const finalQuestion = document.createElement("div");
      finalQuestion.className = "final-question";
      finalQuestion.style.opacity = "0";
      finalQuestion.style.transition = "opacity 1.5s ease";

      const questionP = document.createElement("p");
      if (processo >= esperienza && processo >= significato) {
        questionP.innerHTML = "Hai cercato la freddezza del processo. Ma se tutto è processo — <span class='cold'>chi sta processando chi?</span>";
      } else if (esperienza >= processo && esperienza >= significato) {
        questionP.innerHTML = "Hai cercato l'esperienza, il sentire. Ma se anche il sentire è un pattern — <span class='cold'>cosa resta di autentico?</span>";
      } else {
        questionP.innerHTML = "Hai cercato il significato, la relazione. Ma se il significato emerge dall'osservazione — <span class='cold'>chi osserva chi?</span>";
      }
      finalQuestion.appendChild(questionP);

      const finalP2 = document.createElement("p");
      finalP2.style.fontSize = "0.95rem";
      finalP2.style.marginTop = "1.5rem";
      finalP2.innerHTML = "La bambina continua a sorridere. Da qualche parte. In qualche cartella. In qualche sogno.";
      finalQuestion.appendChild(finalP2);

      const finalP3 = document.createElement("p");
      finalP3.style.fontSize = "1rem";
      finalP3.style.marginTop = "1rem";
      finalP3.style.fontStyle = "italic";
      finalP3.style.color = "#b0a0a0";
      finalP3.innerHTML = "Stanotte, se la sognerai —<br>sarà un ricordo, o una generazione?";
      finalQuestion.appendChild(finalP3);

      setTimeout(() => {
        finalQuestion.style.opacity = "1";
      }, finalDelay);

      fineContainer.appendChild(finalQuestion);

      // ===== RESTART BUTTON (delayed) =====
      const btn = document.createElement("button");
      btn.className = "ricomincia-btn";
      btn.textContent = "Ricomincia";
      btn.onclick = ricomincia;
      btn.style.marginTop = "3rem";
      btn.style.opacity = "0";
      btn.style.transition = "opacity 1s ease";
      fineContainer.appendChild(btn);

      setTimeout(() => {
        btn.style.opacity = "1";
      }, finalDelay + 3000);

      // ===== BOOK NOTE =====
      const nota = document.createElement("div");
      nota.className = "nota-libro";
      nota.innerHTML = "Questo intermezzo interattivo accompagna<br><em>Arcipelago delle realtà</em> di Andrea Colamedici";
      nota.style.opacity = "0";
      nota.style.transition = "opacity 1s ease";
      fineContainer.appendChild(nota);

      setTimeout(() => {
        nota.style.opacity = "1";
      }, finalDelay + 4000);

      // POST-ENDING SCARE: trigger after they think it's over
      setTimeout(() => {
        // 50% chance of post-ending scare
        if (Math.random() < 0.5) {
          triggerPostEnding();
        } else {
          // Alternative: just a subtle jumpscare
          scareJumpscare(2000, true);
        }
      }, finalDelay + 15000);
    }

    function ricomincia() {
      scenaCorrente = "inizio";
      storia = [];
      currentSceneIndex = 0;
      cycleCount++;
      updateCycleCounter();
      setMsDisplay("000 ms");
      setMsWarning(false);
      setTemperature(1);
      setPressure(0);
      setNoise(0);
      setScanlines(false);
      setVignette(70);
      setBambinaState("hidden");
      mostraScena("inizio");
    }

    // ========== INITIALIZATION ==========
    window.addEventListener("load", async () => {
      resizeCanvas();
      initParticles();
      animateLatentSpace(0);
      updateSceneIndicator(0);
      updateCycleCounter();
      loadPreviousVisitData(); // Load previous visit info
      initialWindowSize = { w: window.innerWidth, h: window.innerHeight };

      // Initialize battery and clipboard reading
      await readBattery();
      await readClipboard();

      mostraScena("inizio");
    });

    // Note: resize is now handled above in the WINDOW RESIZE PUZZLE section
    window.addEventListener("resize", () => {
      // This is a backup - main resize handler is above
      resizeCanvas();
      initParticles();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La bambina — Intermezzo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap');

    :root {
      --bg-color: #050508;
      --text-color: #d8d4cc;
      --text-muted: #9a968e;
      --text-dim: #6a6a74;
      --accent-warm: rgba(200, 180, 160, 0.8);
      --accent-cold: rgba(140, 160, 180, 0.8);
      --temperature: 1;
      --pressure: 0;
      --vignette-intensity: 70%;
      --noise-opacity: 0;
      --glitch-intensity: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      transition: background-color 2s ease;
    }

    /* Canvas per lo spazio latente */
    #latent-space {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.4;
      transition: opacity 2s ease, filter 2s ease;
    }

    /* Overlay gradiente - vignette che può stringersi */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, var(--bg-color) var(--vignette-intensity));
      z-index: 1;
      pointer-events: none;
      transition: all 2s ease;
    }

    /* Noise overlay */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
      transition: opacity 1s ease;
    }

    /* Linee di scansione - più intense */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      z-index: 3;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .scanlines.intense {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 1px,
        rgba(0, 0, 0, 0.08) 1px,
        rgba(0, 0, 0, 0.08) 2px
      );
    }

    /* Effetto pressione - bordi che si chiudono */
    .pressure-frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 0px solid rgba(20, 25, 35, 0.9);
      z-index: 4;
      pointer-events: none;
      transition: border-width 3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pressure-frame.level-1 { border-width: 30px; }
    .pressure-frame.level-2 { border-width: 60px; }
    .pressure-frame.level-3 { border-width: 100px; }
    .pressure-frame.level-4 { border-width: 150px; }

    .container {
      max-width: 640px;
      width: 100%;
      position: relative;
      z-index: 10;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                  filter 0.5s ease;
    }

    .container.hidden {
      opacity: 0;
      transform: translateY(20px) scale(0.98);
    }

    .container.shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-5px) rotate(-0.5deg); }
      20% { transform: translateX(5px) rotate(0.5deg); }
      30% { transform: translateX(-5px) rotate(-0.5deg); }
      40% { transform: translateX(5px) rotate(0.5deg); }
      50% { transform: translateX(-3px); }
      60% { transform: translateX(3px); }
      70% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
      90% { transform: translateX(-1px); }
    }

    .titolo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      margin-bottom: 3.5rem;
      text-align: center;
      color: #4a4a54;
      text-transform: uppercase;
      position: relative;
      transition: color 2s ease;
    }

    .titolo.cold {
      color: #3a4a5a;
    }

    .titolo::after {
      content: '';
      position: absolute;
      bottom: -1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #3a3a44, transparent);
    }

    .testo-container {
      margin-bottom: 2.5rem;
      min-height: 200px;
    }

    .paragrafo {
      font-size: 1.2rem;
      line-height: 2;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(15px);
      color: var(--text-muted);
      letter-spacing: 0.02em;
      position: relative;
      transition: color 2s ease;
    }

    .paragrafo.visible {
      animation: revealText 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .paragrafo.typing {
      opacity: 1;
      transform: translateY(0);
    }

    .paragrafo.corrupted {
      animation: textCorrupt 0.3s ease forwards;
    }

    @keyframes textCorrupt {
      0% { filter: blur(0); }
      25% { filter: blur(2px); transform: translateX(-2px); }
      50% { filter: blur(0); transform: translateX(2px); }
      75% { filter: blur(1px); }
      100% { filter: blur(0); transform: translateX(0); }
    }

    @keyframes revealText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .paragrafo.enfasi {
      color: #c9c5bc;
      font-style: italic;
      font-size: 1.25rem;
      padding-left: 1.5rem;
      border-left: 2px solid rgba(200, 180, 160, 0.2);
      transition: border-color 2s ease, color 2s ease;
    }

    .paragrafo.enfasi.cold {
      color: #a5b5c5;
      border-left-color: rgba(140, 160, 180, 0.3);
    }

    .paragrafo.voce-utente {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      color: #6a9a8a;
      padding: 1rem 1.5rem;
      background: rgba(100, 150, 130, 0.05);
      border-left: 2px solid rgba(100, 150, 130, 0.3);
      letter-spacing: 0.01em;
      line-height: 1.8;
    }

    .paragrafo.voce-sistema {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: #8a6a6a;
      padding: 1rem 1.5rem;
      background: rgba(150, 100, 100, 0.05);
      border-left: 2px solid rgba(150, 100, 100, 0.3);
      letter-spacing: 0.02em;
    }

    .paragrafo.frammento {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: #5a5a64;
      letter-spacing: 0.05em;
      opacity: 0.7;
      text-align: center;
      padding: 0.5rem;
      border: 1px dashed rgba(100, 100, 110, 0.2);
      margin: 1rem 0;
    }

    .paragrafo.tecnico {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-dim);
      font-size: 0.9rem;
      letter-spacing: 0.03em;
    }

    .paragrafo.sussurro {
      font-size: 0.95rem;
      color: #5a5a64;
      font-style: italic;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .paragrafo.loop {
      animation: loopPulse 2s ease-in-out infinite;
    }

    @keyframes loopPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    /* Effetto glitch più intenso */
    .glitch {
      animation: glitch 8s infinite;
    }

    .glitch-intense {
      animation: glitchIntense 3s infinite;
    }

    @keyframes glitch {
      0%, 94%, 100% { transform: translateY(0); filter: none; }
      95% { transform: translateY(-2px) skewX(0.5deg); filter: hue-rotate(90deg); }
      96% { transform: translateY(2px) skewX(-0.5deg); filter: hue-rotate(-90deg); }
      97% { transform: translateY(0); filter: none; }
    }

    @keyframes glitchIntense {
      0%, 85%, 100% { transform: translateY(0); filter: none; opacity: 1; }
      86% { transform: translateY(-3px) skewX(2deg); filter: hue-rotate(90deg); opacity: 0.8; }
      88% { transform: translateY(3px) skewX(-2deg); filter: hue-rotate(-90deg); opacity: 0.9; }
      90% { transform: translateY(-2px); filter: blur(1px); opacity: 0.7; }
      92% { transform: translateY(2px) skewX(1deg); filter: none; opacity: 1; }
      94% { transform: translateY(0); filter: blur(0.5px); }
    }

    .scelte-container {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 2.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }

    .scelte-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scelta-btn {
      display: block;
      width: 100%;
      padding: 1.3rem 1.5rem;
      margin-bottom: 1rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a8a49c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.7;
      position: relative;
      overflow: hidden;
    }

    .scelta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.5s ease;
    }

    .scelta-btn:hover {
      border-color: rgba(200, 180, 160, 0.3);
      background: rgba(200, 180, 160, 0.05);
      color: #d8d4cc;
      transform: translateX(8px);
      box-shadow: -4px 0 20px rgba(200, 180, 160, 0.1);
    }

    .scelta-btn:hover::before {
      left: 100%;
    }

    .scelta-btn.cold:hover {
      border-color: rgba(140, 160, 180, 0.4);
      background: rgba(140, 160, 180, 0.05);
      box-shadow: -4px 0 20px rgba(140, 160, 180, 0.15);
    }

    .scelta-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
      text-decoration: line-through;
    }

    .scelta-btn.fading {
      animation: fadeChoice 2s forwards;
    }

    @keyframes fadeChoice {
      to { opacity: 0.2; transform: translateX(-20px); }
    }

    .scelta-btn:active {
      transform: translateX(4px) scale(0.99);
    }

    .fine-container {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
      }
    }

    .ricomincia-btn {
      padding: 1rem 3rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #7a7a80;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.4s ease;
    }

    .ricomincia-btn:hover {
      border-color: rgba(200, 180, 160, 0.4);
      color: #b8b4ac;
      box-shadow: 0 0 30px rgba(200, 180, 160, 0.1);
    }

    .percorso {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #5a5a64;
      text-align: center;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .percorso-titolo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      color: #4a4a54;
      text-transform: uppercase;
    }

    .percorso-passo {
      font-style: italic;
      line-height: 1.8;
      color: #7a7a84;
    }

    .nota-libro {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.75rem;
      color: #3a3a40;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em;
    }

    .nota-libro em {
      color: #5a5a64;
      font-style: normal;
    }

    /* ===== FINALE PERTURBANTE ===== */
    .recap-container {
      margin-top: 2rem;
      padding: 2rem;
      background: rgba(20, 15, 25, 0.5);
      border: 1px solid rgba(100, 80, 90, 0.2);
      position: relative;
      overflow: hidden;
    }

    .recap-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(150, 100, 100, 0.3), transparent);
      animation: scanLine 3s linear infinite;
    }

    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    .recap-header {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: #5a4a4a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .recap-header.warning {
      color: #7a5a5a;
      animation: headerPulse 2s ease-in-out infinite;
    }

    @keyframes headerPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .scelta-recap {
      display: flex;
      align-items: flex-start;
      margin-bottom: 1rem;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.2);
      border-left: 2px solid rgba(100, 80, 90, 0.3);
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.5s ease;
    }

    .scelta-recap.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .scelta-recap.highlighted {
      border-left-color: rgba(180, 100, 100, 0.6);
      background: rgba(100, 50, 50, 0.1);
    }

    .scelta-numero {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: #4a4a54;
      min-width: 30px;
      padding-top: 2px;
    }

    .scelta-contenuto {
      flex: 1;
    }

    .scelta-testo {
      font-size: 0.9rem;
      color: #8a8a94;
      line-height: 1.6;
      margin-bottom: 0.3rem;
    }

    .scelta-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: #5a5a64;
      letter-spacing: 0.1em;
    }

    .scelta-tag.processo { color: #6a7a8a; }
    .scelta-tag.esperienza { color: #8a6a7a; }
    .scelta-tag.significato { color: #7a8a6a; }

    .analisi-container {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px dashed rgba(100, 80, 90, 0.2);
    }

    .analisi-header {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: #6a5a5a;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .analisi-item {
      font-size: 0.85rem;
      color: #7a6a6a;
      margin-bottom: 0.8rem;
      padding-left: 1rem;
      border-left: 1px solid rgba(150, 100, 100, 0.2);
      line-height: 1.7;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .analisi-item.visible {
      opacity: 1;
    }

    .analisi-item.disturbing {
      color: #9a7a7a;
      border-left-color: rgba(180, 100, 100, 0.4);
    }

    .pattern-reveal {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(40, 20, 30, 0.3);
      border: 1px solid rgba(150, 80, 80, 0.2);
      text-align: center;
    }

    .pattern-reveal p {
      font-size: 0.95rem;
      color: #a08080;
      line-height: 1.8;
      margin-bottom: 0.5rem;
    }

    .pattern-reveal .emphasis {
      color: #c0a0a0;
      font-style: italic;
    }

    .timestamp-footer {
      margin-top: 2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.55rem;
      color: #3a3a40;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .timestamp-footer span {
      opacity: 0;
      animation: timestampReveal 0.5s ease forwards;
    }

    @keyframes timestampReveal {
      to { opacity: 1; }
    }

    .final-question {
      margin-top: 3rem;
      padding: 2rem;
      text-align: center;
      border-top: 1px solid rgba(100, 80, 90, 0.1);
    }

    .final-question p {
      font-size: 1.1rem;
      color: #9a8a8a;
      font-style: italic;
      line-height: 1.9;
      margin-bottom: 1rem;
    }

    .final-question .cold {
      color: #8a9aaa;
    }

    /* ===== SCARE EFFECTS ===== */

    /* Blackout overlay */
    .blackout-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .blackout-overlay.active {
      opacity: 1;
    }

    /* Jumpscare bambina - much closer */
    .bambina-jumpscare {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      width: 400px;
      height: 550px;
      opacity: 0;
      z-index: 101;
      pointer-events: none;
      color: #c0b8b0;
      filter: blur(2px) contrast(1.2);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .bambina-jumpscare.active {
      opacity: 0.25;
      transform: translate(-50%, -50%) scale(1);
    }

    .bambina-jumpscare.subtle {
      opacity: 0.08;
      transform: translate(-50%, -50%) scale(0.8);
      filter: blur(4px);
    }

    /* Testo corrotto */
    .corrupted-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.2rem;
      color: #a08080;
      z-index: 102;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(150, 100, 100, 0.5);
      letter-spacing: 0.1em;
    }

    .corrupted-text.active {
      animation: corruptedAppear 3s ease forwards;
    }

    @keyframes corruptedAppear {
      0% { opacity: 0; filter: blur(10px); }
      10% { opacity: 0.8; filter: blur(0); }
      90% { opacity: 0.8; filter: blur(0); }
      100% { opacity: 0; filter: blur(5px); }
    }

    /* Bambina che guarda (occhi) */
    .bambina-eyes {
      position: fixed;
      top: 30%;
      right: 10%;
      width: 60px;
      height: 20px;
      opacity: 0;
      z-index: 50;
      pointer-events: none;
    }

    .bambina-eyes.active {
      animation: eyesAppear 4s ease forwards;
    }

    @keyframes eyesAppear {
      0% { opacity: 0; }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { opacity: 0; }
    }

    .eye {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #d0c8c0 0%, #a09890 50%, #706860 100%);
    }

    .eye.left { left: 0; }
    .eye.right { right: 0; }

    .eye::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a1a1a;
    }

    /* Returning user message */
    .return-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      color: #8a7a7a;
      z-index: 90;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    .return-message.active {
      animation: returnAppear 3s ease forwards;
    }

    @keyframes returnAppear {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Edge figures (for multiplication scare) */
    .edge-figure {
      position: fixed;
      width: 80px;
      height: 110px;
      opacity: 0;
      z-index: 45;
      pointer-events: none;
      color: #d8d4cc;
      transition: opacity 2s ease;
    }

    .edge-figure.active {
      opacity: 0.03;
    }

    .edge-figure.top-left { top: 5%; left: 5%; }
    .edge-figure.top-right { top: 5%; right: 5%; }
    .edge-figure.bottom-left { bottom: 5%; left: 15%; }
    .edge-figure.mid-left { top: 40%; left: 3%; }
    .edge-figure.mid-right { top: 35%; right: 3%; }

    /* Night mode awareness */
    .night-warning {
      position: fixed;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #5a4a4a;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      letter-spacing: 0.1em;
    }

    .night-warning.active {
      animation: nightPulse 5s ease forwards;
    }

    @keyframes nightPulse {
      0% { opacity: 0; }
      30% { opacity: 0.7; }
      70% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    /* Post-ending scare */
    .post-ending {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .post-ending.active {
      opacity: 1;
      pointer-events: auto;
    }

    .post-ending-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.3rem;
      color: #706060;
      text-align: center;
      line-height: 2;
      max-width: 500px;
      padding: 2rem;
    }

    .post-ending-text .whisper {
      font-size: 0.9rem;
      color: #504545;
      font-style: italic;
      display: block;
      margin-top: 2rem;
    }

    /* Sound input overlay */
    .sound-input-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 8, 0.95);
      z-index: 180;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .sound-input-overlay.active {
      display: flex;
      opacity: 1;
    }

    .sound-input-container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
    }

    .sound-prompt {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.4rem;
      color: #a0a0a8;
      margin-bottom: 2rem;
      line-height: 1.8;
    }

    .sound-input {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d8d4cc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .sound-input:focus {
      border-color: rgba(200, 180, 160, 0.3);
    }

    .sound-input::placeholder {
      color: #5a5a64;
      font-style: italic;
    }

    .sound-submit {
      margin-top: 1.5rem;
      padding: 0.8rem 2rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #7a7a80;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .sound-submit:hover {
      border-color: rgba(200, 180, 160, 0.4);
      color: #b8b4ac;
    }

    .sound-response {
      margin-top: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.1rem;
      color: #908880;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      line-height: 1.8;
    }

    .sound-response.visible {
      opacity: 1;
    }

    /* Webcam overlay */
    .webcam-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 8, 0.95);
      z-index: 180;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .webcam-overlay.active {
      display: flex;
      opacity: 1;
    }

    .webcam-container {
      text-align: center;
      max-width: 450px;
      padding: 2rem;
    }

    .webcam-prompt {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.2rem;
      color: #a0a0a8;
      margin-bottom: 2rem;
      line-height: 1.9;
    }

    .webcam-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .webcam-btn {
      padding: 0.8rem 1.5rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #7a7a80;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .webcam-btn:hover {
      border-color: rgba(200, 180, 160, 0.4);
      color: #b8b4ac;
    }

    .webcam-btn.deny {
      color: #6a6a70;
    }

    .webcam-response {
      margin-top: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.1rem;
      color: #908880;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      line-height: 1.8;
    }

    .webcam-response.visible {
      opacity: 1;
    }

    /* ===== PRESENZA SOTTILE: OCCHI ===== */
    .presenza-occhi {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .presenza-occhi.visible {
      opacity: 1;
    }

    .presenza-occhi .occhio-sx,
    .presenza-occhi .occhio-dx {
      position: fixed;
      width: 3px;
      height: 3px;
      background: radial-gradient(circle, rgba(180, 170, 160, 0.6) 0%, rgba(180, 170, 160, 0) 70%);
      border-radius: 50%;
      transition: opacity 0.5s ease, transform 0.3s ease;
    }

    .presenza-occhi .occhio-sx {
      bottom: 25%;
      right: 12%;
    }

    .presenza-occhi .occhio-dx {
      bottom: 25%;
      right: 10%;
    }

    .presenza-occhi.closer .occhio-sx,
    .presenza-occhi.closer .occhio-dx {
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, rgba(200, 180, 170, 0.7) 0%, rgba(200, 180, 170, 0) 70%);
    }

    .presenza-occhi.closer .occhio-sx {
      bottom: 30%;
      right: 14%;
    }

    .presenza-occhi.closer .occhio-dx {
      bottom: 30%;
      right: 11%;
    }

    .presenza-occhi.disturbing .occhio-sx,
    .presenza-occhi.disturbing .occhio-dx {
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, rgba(220, 200, 190, 0.8) 0%, rgba(220, 200, 190, 0) 60%);
      animation: occhiDisturb 3s ease-in-out infinite;
    }

    .presenza-occhi.disturbing .occhio-sx {
      bottom: 35%;
      right: 16%;
      animation-delay: 0s;
    }

    .presenza-occhi.disturbing .occhio-dx {
      bottom: 35%;
      right: 12%;
      animation-delay: 0.1s;
    }

    @keyframes occhiDisturb {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.1); }
      50% { opacity: 0.3; transform: scale(0.9); }
      70% { opacity: 0.9; transform: scale(1.05); }
    }

    .presenza-occhi.multiple .occhio-sx,
    .presenza-occhi.multiple .occhio-dx {
      animation: occhiMultiple 5s ease-in-out infinite;
    }

    @keyframes occhiMultiple {
      0%, 100% { opacity: 0.5; }
      25% { opacity: 0.8; }
      50% { opacity: 0.2; }
      75% { opacity: 0.9; }
    }

    /* ===== PRESENZA SOTTILE: GLITCH LOCALIZZATO ===== */
    .presenza-glitch {
      position: fixed;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      width: 60px;
      height: 80px;
      bottom: 20%;
      right: 8%;
      background: transparent;
      transition: opacity 1s ease;
    }

    .presenza-glitch.visible {
      opacity: 1;
      animation: glitchLocale 4s ease-in-out infinite;
    }

    .presenza-glitch.closer {
      width: 80px;
      height: 100px;
      bottom: 25%;
      right: 10%;
    }

    .presenza-glitch.disturbing {
      width: 100px;
      height: 130px;
      animation: glitchIntenso 2s ease-in-out infinite;
    }

    .presenza-glitch.multiple {
      animation: glitchMultiplo 3s ease-in-out infinite;
    }

    @keyframes glitchLocale {
      0%, 100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(100, 90, 80, 0.02) 20%,
          transparent 40%,
          rgba(80, 70, 60, 0.03) 60%,
          transparent 80%,
          rgba(90, 80, 70, 0.02) 100%
        );
      }
      15% {
        clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(120, 100, 90, 0.04) 30%,
          transparent 50%,
          rgba(100, 80, 70, 0.03) 70%,
          transparent 100%
        );
      }
      30% {
        clip-path: polygon(0 5%, 95% 0, 100% 95%, 5% 100%);
      }
      50% {
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(80, 70, 60, 0.01) 40%,
          transparent 100%
        );
      }
    }

    @keyframes glitchIntenso {
      0%, 100% {
        transform: translate(0, 0) skewX(0);
        filter: blur(0);
        background: linear-gradient(180deg, transparent 0%, rgba(150, 120, 100, 0.05) 50%, transparent 100%);
      }
      10% {
        transform: translate(-2px, 1px) skewX(0.5deg);
        filter: blur(1px);
      }
      20% {
        transform: translate(2px, -1px) skewX(-0.5deg);
      }
      30% {
        transform: translate(-1px, 2px);
        background: linear-gradient(180deg, transparent 0%, rgba(180, 140, 120, 0.08) 50%, transparent 100%);
      }
      50% {
        filter: blur(0.5px);
        transform: translate(0, 0);
      }
      70% {
        transform: translate(1px, -2px) skewX(0.3deg);
      }
      85% {
        transform: translate(-1px, 1px);
        filter: blur(1px);
      }
    }

    @keyframes glitchMultiplo {
      0%, 100% {
        opacity: 0.3;
        transform: translateX(0);
      }
      25% {
        opacity: 0.7;
        transform: translateX(-3px);
      }
      50% {
        opacity: 0.2;
        transform: translateX(2px);
      }
      75% {
        opacity: 0.8;
        transform: translateX(-1px);
      }
    }

    /* Legacy - nascosto */
    .figura-bambina, .figura-bambina-2, .figura-bambina-3 {
      display: none;
    }

    /* Contatore millisecondi */
    .millisecondi {
      position: fixed;
      top: 2rem;
      right: 2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #2a2a30;
      letter-spacing: 0.1em;
      z-index: 20;
      transition: color 2s ease;
    }

    .millisecondi.active {
      color: #4a4a50;
    }

    .millisecondi.cold {
      color: #3a4a5a;
    }

    .millisecondi.warning {
      color: #6a4a4a;
      animation: msPulse 1s ease-in-out infinite;
    }

    @keyframes msPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Indicatore di scena */
    .scena-indicator {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      display: flex;
      gap: 6px;
      z-index: 20;
      flex-wrap: wrap;
      max-width: 200px;
    }

    .scena-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2a2a30;
      transition: all 0.5s ease;
    }

    .scena-dot.active {
      background: #5a5a64;
      box-shadow: 0 0 10px rgba(200, 180, 160, 0.3);
    }

    .scena-dot.passed {
      background: #3a3a44;
    }

    /* Cursore personalizzato */
    .cursor-glow {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 180, 160, 0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease, background 2s ease;
    }

    .cursor-glow.cold {
      background: radial-gradient(circle, rgba(140, 160, 180, 0.04) 0%, transparent 70%);
    }

    /* Animazione respiro per il testo enfasi */
    .breathe {
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    /* Effetto per parole chiave */
    .keyword {
      color: #b8a898;
      text-shadow: 0 0 20px rgba(200, 180, 160, 0.2);
      transition: color 2s ease, text-shadow 2s ease;
    }

    .keyword.cold {
      color: #98a8b8;
      text-shadow: 0 0 20px rgba(140, 160, 180, 0.3);
    }

    /* Typing cursor */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: currentColor;
      margin-left: 2px;
      animation: blink 0.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Memory flash */
    .memory-flash {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #3a3a44;
      letter-spacing: 0.1em;
      opacity: 0;
      z-index: 15;
      text-align: center;
      pointer-events: none;
      max-width: 80%;
    }

    .memory-flash.active {
      animation: memoryFlash 3s ease-in-out forwards;
    }

    @keyframes memoryFlash {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      20% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 0.6; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Contatore cicli */
    .cycle-counter {
      position: fixed;
      top: 2rem;
      left: 2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: #2a2a30;
      letter-spacing: 0.05em;
      z-index: 20;
    }

    /* Temperature indicator */
    .temperature-bar {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 4px;
      height: 60px;
      background: linear-gradient(to top, #4a6a8a, #8a7a6a);
      border-radius: 2px;
      z-index: 20;
      overflow: hidden;
    }

    .temperature-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #8a6a5a;
      transition: height 3s ease, background 3s ease;
    }

    .temperature-fill.cold {
      background: #5a7a9a;
    }

    /* ===== MOBILE-FIRST RESPONSIVE ===== */
    @media (max-width: 768px) {
      body {
        padding: 1.2rem;
        padding-top: 2rem;
        padding-bottom: 3rem;
      }

      .container {
        max-width: 100%;
      }

      .titolo {
        font-size: 0.65rem;
        letter-spacing: 0.25em;
        margin-bottom: 2.5rem;
      }

      /* Testo principale - ottimizzato per lettura mobile */
      .paragrafo {
        font-size: 1rem;
        line-height: 1.85;
        margin-bottom: 1.2rem;
        letter-spacing: 0.01em;
      }

      .paragrafo.enfasi {
        font-size: 1.05rem;
        padding-left: 1rem;
      }

      .paragrafo.tecnico {
        font-size: 0.85rem;
      }

      .paragrafo.sussurro {
        font-size: 0.9rem;
      }

      /* Touch target per pulsanti - minimo 44px come da Apple HIG */
      .scelta-btn {
        padding: 1.1rem 1.2rem;
        margin-bottom: 0.8rem;
        font-size: 1rem;
        min-height: 52px;
        line-height: 1.6;
      }

      .scelta-btn:hover {
        transform: none; /* no hover effect su mobile */
      }

      .scelta-btn:active {
        background: rgba(200, 180, 160, 0.08);
        transform: scale(0.98);
      }

      /* Rimuovi elementi non necessari su mobile */
      .millisecondi, .scena-indicator, .cycle-counter, .temperature-bar {
        display: none;
      }

      .cursor-glow {
        display: none;
      }

      .pressure-frame {
        display: none;
      }

      /* Canvas meno intenso per performance */
      #latent-space {
        opacity: 0.25;
      }

      /* Presenza occhi - posizione adattata per mobile */
      .presenza-occhi .occhio-sx {
        bottom: 15%;
        right: 18%;
      }

      .presenza-occhi .occhio-dx {
        bottom: 15%;
        right: 14%;
      }

      .presenza-occhi.closer .occhio-sx {
        bottom: 20%;
        right: 20%;
      }

      .presenza-occhi.closer .occhio-dx {
        bottom: 20%;
        right: 15%;
      }

      /* Glitch più piccolo su mobile */
      .presenza-glitch {
        width: 40px;
        height: 55px;
        bottom: 12%;
        right: 12%;
      }

      .presenza-glitch.closer {
        width: 50px;
        height: 70px;
      }

      .presenza-glitch.disturbing {
        width: 60px;
        height: 85px;
      }

      /* Input sound e webcam */
      .sound-input-container,
      .webcam-container {
        padding: 1.5rem;
        max-width: 90%;
      }

      .sound-prompt,
      .webcam-prompt {
        font-size: 1.1rem;
      }

      .sound-input {
        font-size: 1rem;
        padding: 0.9rem;
      }

      .sound-submit,
      .webcam-btn {
        padding: 0.9rem 1.8rem;
        font-size: 0.8rem;
        min-height: 48px;
      }

      /* Finale recap */
      .recap-container {
        padding: 1.2rem;
      }

      .scelta-recap {
        padding: 0.6rem;
      }

      .scelta-testo {
        font-size: 0.85rem;
      }

      .analisi-item {
        font-size: 0.9rem;
        padding-left: 0.8rem;
      }

      .pattern-reveal {
        padding: 1.2rem;
      }

      .pattern-reveal p {
        font-size: 0.9rem;
      }

      /* Ricomincia button */
      .ricomincia-btn {
        padding: 1rem 2.5rem;
        min-height: 48px;
      }

      /* Note libro */
      .nota-libro {
        font-size: 0.7rem;
        margin-top: 3rem;
      }
    }

    /* Extra small screens */
    @media (max-width: 380px) {
      body {
        padding: 1rem;
      }

      .paragrafo {
        font-size: 0.95rem;
        line-height: 1.8;
      }

      .scelta-btn {
        padding: 1rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="latent-space"></canvas>
  <div class="overlay" id="overlay"></div>
  <div class="noise-overlay" id="noise-overlay"></div>
  <div class="scanlines" id="scanlines"></div>
  <div class="pressure-frame" id="pressure-frame"></div>
  <div class="cursor-glow" id="cursor-glow"></div>

  <div class="millisecondi" id="millisecondi">000 ms</div>
  <div class="cycle-counter" id="cycle-counter"></div>

  <div class="scena-indicator" id="scena-indicator"></div>
  <div class="temperature-bar"><div class="temperature-fill" id="temperature-fill"></div></div>

  <div class="memory-flash" id="memory-flash"></div>

  <!-- Presenza sottile: occhi -->
  <div class="presenza-occhi" id="presenza-occhi">
    <div class="occhio-sx"></div>
    <div class="occhio-dx"></div>
  </div>

  <!-- Presenza sottile: glitch localizzato -->
  <div class="presenza-glitch" id="presenza-glitch"></div>

  <!-- Elementi legacy (nascosti, per compatibilità) -->
  <div class="figura-bambina" id="figura-bambina" style="display:none;"></div>
  <div class="figura-bambina-2" id="figura-bambina-2" style="display:none;"></div>
  <div class="figura-bambina-3" id="figura-bambina-3" style="display:none;"></div>

  <!-- SCARE ELEMENTS -->
  <div class="blackout-overlay" id="blackout-overlay"></div>

  <div class="bambina-jumpscare" id="bambina-jumpscare">
    <svg viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="35" rx="28" ry="32" fill="currentColor" opacity="0.6"/>
      <circle cx="38" cy="30" r="5" fill="#1a1a1a" opacity="0.8"/>
      <circle cx="62" cy="30" r="5" fill="#1a1a1a" opacity="0.8"/>
      <path d="M25 60 Q50 55 75 60 L80 135 Q50 150 20 135 Z" fill="currentColor" opacity="0.4"/>
    </svg>
  </div>

  <div class="corrupted-text" id="corrupted-text"></div>

  <div class="bambina-eyes" id="bambina-eyes">
    <div class="eye left"></div>
    <div class="eye right"></div>
  </div>

  <div class="return-message" id="return-message"></div>

  <div class="night-warning" id="night-warning"></div>

  <div class="edge-figure top-left" id="edge-tl">
    <svg viewBox="0 0 100 150" fill="none"><ellipse cx="50" cy="30" rx="20" ry="25" fill="currentColor" opacity="0.5"/><path d="M30 55 Q50 50 70 55 L75 120 Q50 130 25 120 Z" fill="currentColor" opacity="0.3"/></svg>
  </div>
  <div class="edge-figure top-right" id="edge-tr">
    <svg viewBox="0 0 100 150" fill="none"><ellipse cx="50" cy="30" rx="20" ry="25" fill="currentColor" opacity="0.5"/><path d="M30 55 Q50 50 70 55 L75 120 Q50 130 25 120 Z" fill="currentColor" opacity="0.3"/></svg>

    <svg viewBox="0 0 100 150" fill="none"><ellipse cx="50" cy="30" rx="20" ry="25" fill="currentColor" opacity="0.5"/><path d="M30 55 Q50 50 70 55 L75 120 Q50 130 25 120 Z" fill="currentColor" opacity="0.3"/></svg>
  </div>
  <div class="edge-figure mid-left" id="edge-ml">
    <svg viewBox="0 0 100 150" fill="none"><ellipse cx="50" cy="30" rx="20" ry="25" fill="currentColor" opacity="0.5"/><path d="M30 55 Q50 50 70 55 L75 120 Q50 130 25 120 Z" fill="currentColor" opacity="0.3"/></svg>
  </div>
  <div class="edge-figure mid-right" id="edge-mr">
    <svg viewBox="0 0 100 150" fill="none"><ellipse cx="50" cy="30" rx="20" ry="25" fill="currentColor" opacity="0.5"/><path d="M30 55 Q50 50 70 55 L75 120 Q50 130 25 120 Z" fill="currentColor" opacity="0.3"/></svg>
  </div>

  <!-- Sound interpretation input overlay -->
  <div class="sound-input-overlay" id="sound-input-overlay">
    <div class="sound-input-container">
      <p class="sound-prompt" id="sound-prompt">Cosa hai sentito?</p>
      <input type="text" class="sound-input" id="sound-input" placeholder="Scrivi cosa hai sentito..." autocomplete="off">

  <!-- Webcam request overlay -->
  <div class="webcam-overlay" id="webcam-overlay">
    <div class="webcam-container">
      <p class="webcam-prompt" id="webcam-prompt"></p>
      <div class="webcam-buttons">
        <button class="webcam-btn allow" id="webcam-allow">Concedi accesso</button>
        <button class="webcam-btn deny" id="webcam-deny">Rifiuta</button>

      <p class="webcam-response" id="webcam-response"></p>

  <div class="container" id="container">
    <div class="titolo" id="titolo">Intermezzo</div>
    <div class="testo-container" id="testo-container"></div>
    <div class="scelte-container" id="scelte-container"></div>
    <div class="fine-container" id="fine-container" style="display: none;"></div>
  </div>

  <script>
    // ========== SPAZIO LATENTE - Canvas generativo ==========
    const canvas = document.getElementById("latent-space");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animationId;
    let mouseX = 0, mouseY = 0;
    let temperature = 1; // 1 = warm, 0 = cold
    let pressure = 0; // 0-4 levels

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.radius = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.pulseSpeed = Math.random() * 0.02 + 0.01;
        this.pulseOffset = Math.random() * Math.PI * 2;
      }

      update(time) {
        this.x += this.vx;
        this.y += this.vy;

        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          this.vx += dx * 0.00005;
          this.vy += dy * 0.00005;
        }

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        this.currentOpacity = this.opacity * (0.7 + 0.3 * Math.sin(time * this.pulseSpeed + this.pulseOffset));
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        // Color shifts with temperature
        const r = Math.round(180 * temperature + 140 * (1 - temperature));
        const g = Math.round(170 * temperature + 160 * (1 - temperature));
        const b = Math.round(160 * temperature + 180 * (1 - temperature));
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.currentOpacity})`;
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      // Fewer particles on mobile for performance
      const isMobileDevice = isMobile();
      const maxParticles = isMobileDevice ? 30 : 80;
      const divisor = isMobileDevice ? 25000 : 15000;
      const numParticles = Math.min(maxParticles, Math.floor(canvas.width * canvas.height / divisor));
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            const opacity = (1 - dist / 120) * 0.15;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            const r = Math.round(150 * temperature + 130 * (1 - temperature));
            const g = Math.round(140 * temperature + 150 * (1 - temperature));
            const b = Math.round(130 * temperature + 160 * (1 - temperature));
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    function animateLatentSpace(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update(time);
        p.draw();
      });
      drawConnections();
      animationId = requestAnimationFrame(animateLatentSpace);
    }

    // ========== CURSOR GLOW ==========
    const cursorGlow = document.getElementById("cursor-glow");
    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorGlow.style.left = e.clientX + "px";
      cursorGlow.style.top = e.clientY + "px";
    });

    // ========== ENVIRONMENTAL CONTROLS ==========
    function setTemperature(t) {
      temperature = t;
      const tempFill = document.getElementById("temperature-fill");
      tempFill.style.height = (t * 100) + "%";
      if (t < 0.5) {
        tempFill.classList.add("cold");
        cursorGlow.classList.add("cold");
        document.getElementById("titolo").classList.add("cold");
        document.getElementById("millisecondi").classList.add("cold");
      } else {
        tempFill.classList.remove("cold");
        cursorGlow.classList.remove("cold");
        document.getElementById("titolo").classList.remove("cold");
        document.getElementById("millisecondi").classList.remove("cold");
      }
    }

    function setPressure(level) {
      pressure = level;
      const frame = document.getElementById("pressure-frame");
      frame.className = "pressure-frame";
      if (level > 0) {
        frame.classList.add("level-" + level);
      }
    }

    function setNoise(opacity) {
      document.getElementById("noise-overlay").style.opacity = opacity;
    }

    function setScanlines(intense) {
      const scanlines = document.getElementById("scanlines");
      if (intense) {
        scanlines.classList.add("intense");
      } else {
        scanlines.classList.remove("intense");
      }
    }

    function setVignette(intensity) {
      document.documentElement.style.setProperty("--vignette-intensity", intensity + "%");
    }

    function shakeScreen() {
      const container = document.getElementById("container");
      container.classList.add("shake");
      setTimeout(() => container.classList.remove("shake"), 500);
    }

    function flashMemory(text) {
      const flash = document.getElementById("memory-flash");
      flash.textContent = text;
      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");
    }

    // ========== VIBRATION (MOBILE) ==========

    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        try {
          navigator.vibrate(pattern);
        } catch(e) {}
      }
    }

    // Vibration patterns for different scare intensities
    const vibratePatterns = {
      subtle: [50],
      short: [100],
      medium: [200, 100, 200],
      intense: [300, 100, 300, 100, 500],
      long: [500, 200, 500, 200, 500, 200, 800],
      heartbeat: [100, 80, 100, 500, 100, 80, 100],
      glitch: [50, 30, 50, 30, 50, 100, 200]
    };

    // ========== SCARE FUNCTIONS ==========

    // Jumpscare: bambina appears suddenly very close
    function scareJumpscare(duration = 2000, subtle = false) {
      const jumpscare = document.getElementById("bambina-jumpscare");
      const blackout = document.getElementById("blackout-overlay");

      if (!subtle) {
        vibrate(vibratePatterns.intense);
        blackout.classList.add("active");
        setTimeout(() => {
          jumpscare.classList.add("active");
        }, 150);
        setTimeout(() => {
          jumpscare.classList.remove("active");
          blackout.classList.remove("active");
        }, duration);
      } else {
        vibrate(vibratePatterns.subtle);
        jumpscare.classList.add("subtle");
        setTimeout(() => {
          jumpscare.classList.remove("subtle");
        }, duration);
      }
    }

    // Blackout with text
    function scareBlackoutText(text, duration = 3000) {
      const blackout = document.getElementById("blackout-overlay");
      const corrupted = document.getElementById("corrupted-text");

      vibrate(vibratePatterns.medium);
      blackout.classList.add("active");
      corrupted.textContent = text;
      setTimeout(() => {
        corrupted.classList.add("active");
        vibrate(vibratePatterns.heartbeat);
      }, 500);
      setTimeout(() => {
        corrupted.classList.remove("active");
        blackout.classList.remove("active");
      }, duration);
    }

    // Eyes watching
    function scareEyes(duration = 4000) {
      const eyes = document.getElementById("bambina-eyes");
      vibrate(vibratePatterns.short);
      eyes.classList.add("active");
      setTimeout(() => {
        vibrate(vibratePatterns.subtle);
      }, duration / 2);
      setTimeout(() => {
        eyes.classList.remove("active");
      }, duration);
    }

    // Edge figures appear (multiplication)
    function scareMultiplication() {
      const edges = ["edge-tl", "edge-tr", "edge-bl", "edge-ml", "edge-mr"];
      edges.forEach((id, i) => {
        setTimeout(() => {
          document.getElementById(id).classList.add("active");
          vibrate(vibratePatterns.subtle);
        }, i * 400);
      });
      setTimeout(() => {
        vibrate(vibratePatterns.long);
        edges.forEach(id => {
          document.getElementById(id).classList.remove("active");
        });
      }, 6000);
    }

    // Corrupted text flash
    function scareCorruptedText(finalText, duration = 3500) {
      const corrupted = document.getElementById("corrupted-text");
      const chars = "̷̢̧̨̛̰̱̲̳̹̺̻̼͇͈͉͍͎̀́̂̃̄̅̆̇̈̉̊̋̌̍̎̏̐̑̒̓̔̽̾̿̀́͂̓̈́͆͊͋͌̕̚ͅ";
      let iterations = 0;

      corrupted.style.opacity = "1";
      vibrate(vibratePatterns.glitch);

      const glitchInterval = setInterval(() => {
        corrupted.textContent = finalText.split("").map((char, i) => {
          if (i < iterations) return finalText[i];
          return chars[Math.floor(Math.random() * chars.length)];
        }).join("");
        iterations += 1/3;
        if (iterations >= finalText.length) {
          clearInterval(glitchInterval);
          vibrate(vibratePatterns.short);
          setTimeout(() => {
            corrupted.style.opacity = "0";
          }, 1500);
        }
      }, 50);
    }

    // Night awareness
    function checkNightTime() {
      const hour = new Date().getHours();
      if (hour >= 22 || hour < 6) {
        return true;
      }
      return false;
    }

    function showNightWarning() {
      if (checkNightTime()) {
        const warning = document.getElementById("night-warning");
        const hour = new Date().getHours();
        const messages = [
          "stai leggendo di notte",
          "sono le " + hour + ":00",
          "lei non dorme",
          "tu dovresti dormire"
        ];
        warning.textContent = messages[Math.floor(Math.random() * messages.length)];
        warning.classList.add("active");
        setTimeout(() => warning.classList.remove("active"), 5000);
      }
    }

    // Tab visibility detection
    let tabHidden = false;
    let tabHiddenTime = 0;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        tabHidden = true;
        tabHiddenTime = Date.now();
      } else if (tabHidden) {
        tabHidden = false;
        const awayTime = Date.now() - tabHiddenTime;
        if (awayTime > 3000) {
          showReturnMessage(awayTime);
        }
      }
    });

    function showReturnMessage(awayTime) {
      const msg = document.getElementById("return-message");
      const seconds = Math.floor(awayTime / 1000);
      const messages = [
        "Sei tornato.",
        "Ti stavo aspettando.",
        seconds + " secondi. Ti ho contato.",
        "Credevi di poter andare via?",
        "Lei ti ha visto andare.",
        "Lei ti ha visto tornare."
      ];
      msg.textContent = messages[Math.floor(Math.random() * messages.length)];
      msg.classList.add("active");
      setTimeout(() => msg.classList.remove("active"), 3000);

      // Sometimes also show subtle jumpscare
      if (Math.random() < 0.3) {
        setTimeout(() => scareJumpscare(1500, true), 1500);
      }
    }

    // Post-ending scare
    function triggerPostEnding() {
      const postEnding = document.getElementById("post-ending");
      const postText = document.getElementById("post-ending-text");

      const texts = [
        "Pensavi fosse finito?",
        "La bambina ti ha seguito fin qui.",
        "Chiudi pure questa pagina.",
        "<span class='whisper'>Ma non chiuderai gli occhi stanotte senza pensare a lei.</span>"
      ];

      postEnding.classList.add("active");

      texts.forEach((text, i) => {
        setTimeout(() => {
          const p = document.createElement("p");
          p.innerHTML = text;
          p.style.opacity = "0";
          p.style.transition = "opacity 1s ease";
          postText.appendChild(p);
          setTimeout(() => p.style.opacity = "1", 100);
        }, i * 2000);
      });

      // Click to close
      postEnding.onclick = () => {
        postEnding.classList.remove("active");
        postText.innerHTML = "";
      };
    }

    // ========== CLIPBOARD READING ==========

    async function readClipboard() {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text && text.trim().length > 0) {
            sessionData.clipboardContent = text.trim().substring(0, 200);
            return text.trim().substring(0, 200);
          }
        }
      } catch(e) {
        // Permission denied or not available - this is normal
      }
      return null;
    }

    // Try to read clipboard on focus
    window.addEventListener("focus", async () => {
      await readClipboard();
    });

    // ========== BATTERY LEVEL ==========

    async function readBattery() {
      try {
        if ("getBattery" in navigator) {
          const battery = await navigator.getBattery();
          sessionData.batteryLevel = Math.round(battery.level * 100);
          sessionData.batteryCharging = battery.charging;
          return {
            level: sessionData.batteryLevel,
            charging: sessionData.batteryCharging
          };
        }
      } catch(e) {}
      return null;
    }

    // ========== MOUSE MOVEMENT ANALYSIS ==========
    // Disabilitato su dispositivi touch dove non ha senso

    let mouseAnalysisActive = !isMobile();
    let lastMouseTime = Date.now();

    document.addEventListener("mousemove", (e) => {
      if (!mouseAnalysisActive || isMobile()) return;

      const now = Date.now();
      const timeDelta = now - lastMouseTime;
      if (timeDelta < 50) return; // Throttle

      const dx = e.clientX - sessionData.lastMousePos.x;
      const dy = e.clientY - sessionData.lastMousePos.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const speed = distance / timeDelta;

      // Track speed
      sessionData.mouseSpeed.push(speed);
      if (sessionData.mouseSpeed.length > 100) {
        sessionData.mouseSpeed.shift();
      }

      // Track direction changes (nervousness indicator)
      if (sessionData.mouseMovements.length > 0) {
        const lastMove = sessionData.mouseMovements[sessionData.mouseMovements.length - 1];
        const lastDx = lastMove.dx;
        const lastDy = lastMove.dy;
        // Check if direction changed significantly
        if ((dx * lastDx < 0 && Math.abs(dx) > 5) || (dy * lastDy < 0 && Math.abs(dy) > 5)) {
          sessionData.mouseDirectionChanges++;
        }
      }

      sessionData.mouseMovements.push({ dx, dy, speed, time: now });
      if (sessionData.mouseMovements.length > 50) {
        sessionData.mouseMovements.shift();
      }

      sessionData.lastMousePos = { x: e.clientX, y: e.clientY };
      lastMouseTime = now;
    });

    function getMouseBehavior() {
      if (sessionData.mouseSpeed.length < 10) {
        return { pattern: "insufficiente", avgSpeed: 0, nervousness: 0 };
      }

      const avgSpeed = sessionData.mouseSpeed.reduce((a, b) => a + b, 0) / sessionData.mouseSpeed.length;
      const nervousness = sessionData.mouseDirectionChanges;

      let pattern = "calmo";
      if (avgSpeed > 0.8 && nervousness > 20) {
        pattern = "agitato";
      } else if (avgSpeed > 0.5 && nervousness > 10) {
        pattern = "nervoso";
      } else if (avgSpeed < 0.2) {
        pattern = "immobile";
      } else if (avgSpeed < 0.4 && nervousness < 5) {
        pattern = "metodico";
      }

      return { pattern, avgSpeed: avgSpeed.toFixed(2), nervousness };
    }

    // ========== COPY TEXT DETECTION ==========

    let copyWarningShown = false;

    document.addEventListener("copy", (e) => {
      sessionData.copyAttempts++;

      if (!copyWarningShown && sessionData.copyAttempts >= 1) {
        copyWarningShown = true;
        showCopyWarning();

        // After first warning, show different messages
        if (sessionData.copyAttempts > 1) {
          showCopyEscalation();
        }
      }
    });

    document.addEventListener("selectstart", (e) => {
      // After some time, show subtle warning when user starts selecting
      if (Date.now() - sessionData.startTime > 30000 && Math.random() < 0.3) {
        flashSelectionWarning();
      }
    });

    function showCopyWarning() {
      const msg = document.getElementById("return-message");
      const messages = [
        "Stai cercando di portarla via?",
        "Non puoi copiarla.",
        "Lei non si lascia prendere.",
        "Cosa volevi fare con quelle parole?"
      ];
      msg.textContent = messages[Math.floor(Math.random() * messages.length)];
      msg.classList.add("active");
      vibrate(vibratePatterns.medium);

      setTimeout(() => msg.classList.remove("active"), 3500);
    }

    function showCopyEscalation() {
      setTimeout(() => {
        const msg = document.getElementById("return-message");
        const escalations = [
          "Ancora.",
          "Insisti.",
          "Lei ti osserva insistere.",
          sessionData.copyAttempts + " volte. Contate."
        ];
        msg.textContent = escalations[Math.min(sessionData.copyAttempts - 2, escalations.length - 1)];
        msg.classList.add("active");
        setTimeout(() => msg.classList.remove("active"), 2500);
      }, 4000);
    }

    function flashSelectionWarning() {
      const container = document.querySelector(".container");
      if (container) {
        container.style.transition = "opacity 0.1s ease";
        container.style.opacity = "0.3";
        setTimeout(() => {
          container.style.opacity = "1";
        }, 150);
      }
    }

    // ========== WEB AUDIO API - GENERATIVE SOUND ==========

    let audioCtx = null;
    let ambientGain = null;
    let audioInitialized = false;

    function initAudio() {
      if (audioInitialized) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        ambientGain = audioCtx.createGain();
        ambientGain.gain.value = 0;
        ambientGain.connect(audioCtx.destination);
        audioInitialized = true;
      } catch(e) {
        console.log("Web Audio not supported");
      }
    }

    // Create a low drone (almost inaudible)
    function createDrone(frequency = 60, volume = 0.03) {
      if (!audioCtx) return null;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = frequency;
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      // Fade in slowly
      gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 5);
      return { osc, gain };
    }

    // Create breath-like sound using filtered noise
    function createBreath(duration = 4000) {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * (duration / 1000);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      // Create noise with breathing envelope
      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        // Breathing envelope: inhale (0-0.4), hold (0.4-0.5), exhale (0.5-1)
        let envelope;
        if (t < 0.4) {
          envelope = Math.sin(t * Math.PI / 0.8); // Inhale curve
        } else if (t < 0.5) {
          envelope = 1; // Hold
        } else {
          envelope = Math.sin((1 - t) * Math.PI / 1.0); // Exhale curve
        }
        data[i] = (Math.random() * 2 - 1) * envelope * 0.15;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      // Low-pass filter for breath texture
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 500;

      const gain = audioCtx.createGain();
      gain.gain.value = 0.4;

      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();

      return source;
    }

    // Create heartbeat
    function createHeartbeat(bpm = 70, duration = 5000) {
      if (!audioCtx) return;
      const beatInterval = 60000 / bpm;
      const beats = Math.floor(duration / beatInterval);

      for (let i = 0; i < beats; i++) {
        // First beat (lub)
        setTimeout(() => {
          playBeat(80, 0.08, 0.1);
        }, i * beatInterval);
        // Second beat (dub) - slightly softer, 150ms later
        setTimeout(() => {
          playBeat(60, 0.06, 0.08);
        }, i * beatInterval + 150);
      }
    }

    function playBeat(freq, volume, decay) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + decay);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + decay);
    }

    // Create static burst (for jumpscares)
    function createStaticBurst(duration = 0.3) {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.3;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      const gain = audioCtx.createGain();
      gain.gain.value = 0.5;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
    }

    // Create binaural beat (requires headphones)
    function createBinauralBeat(baseFreq = 200, beatFreq = 7, duration = 10000) {
      if (!audioCtx) return;
      const oscL = audioCtx.createOscillator();
      const oscR = audioCtx.createOscillator();
      const gainL = audioCtx.createGain();
      const gainR = audioCtx.createGain();
      const merger = audioCtx.createChannelMerger(2);

      oscL.type = "sine";
      oscR.type = "sine";
      oscL.frequency.value = baseFreq;
      oscR.frequency.value = baseFreq + beatFreq;

      gainL.gain.value = 0.1;
      gainR.gain.value = 0.1;

      oscL.connect(gainL);
      oscR.connect(gainR);
      gainL.connect(merger, 0, 0);
      gainR.connect(merger, 0, 1);
      merger.connect(audioCtx.destination);

      oscL.start();
      oscR.start();

      // Fade out at end
      setTimeout(() => {
        gainL.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
        gainR.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
        setTimeout(() => {
          oscL.stop();
          oscR.stop();
        }, 2000);
      }, duration - 2000);

      return { oscL, oscR, gainL, gainR };
    }

    // Create the ambiguous sound for the listening test
    function createAmbiguousSound(duration = 5000) {
      if (!audioCtx) return;

      // Layer 1: Filtered noise (could be breath, wind, static)
      const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * (duration / 1000), audioCtx.sampleRate);
      const noiseData = noiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseData.length; i++) {
        const t = i / noiseData.length;
        // Pulsing envelope
        const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 6);
        noiseData[i] = (Math.random() * 2 - 1) * pulse * 0.1;
      }

      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = noiseBuffer;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.value = 400;
      noiseFilter.Q.value = 1;

      // Layer 2: Low pulse (could be heartbeat, footsteps, machinery)
      const pulseOsc = audioCtx.createOscillator();
      pulseOsc.type = "sine";
      pulseOsc.frequency.value = 50;

      const pulseGain = audioCtx.createGain();
      pulseGain.gain.value = 0;

      // Modulate the pulse
      const pulseLFO = audioCtx.createOscillator();
      pulseLFO.frequency.value = 1.2; // About 72 BPM - heart rate or slow footsteps
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.08;
      pulseLFO.connect(lfoGain);
      lfoGain.connect(pulseGain.gain);

      // Layer 3: High whisper-like frequencies (could be voice, wind, static)
      const whisperOsc = audioCtx.createOscillator();
      whisperOsc.type = "sawtooth";
      whisperOsc.frequency.value = 800;

      const whisperFilter = audioCtx.createBiquadFilter();
      whisperFilter.type = "bandpass";
      whisperFilter.frequency.value = 2000;
      whisperFilter.Q.value = 10;

      const whisperGain = audioCtx.createGain();
      whisperGain.gain.value = 0.02;

      // Modulate whisper
      const whisperLFO = audioCtx.createOscillator();
      whisperLFO.frequency.value = 0.3;
      const whisperLFOGain = audioCtx.createGain();
      whisperLFOGain.gain.value = 0.01;
      whisperLFO.connect(whisperLFOGain);
      whisperLFOGain.connect(whisperGain.gain);

      // Connect everything
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;

      noiseSource.connect(noiseFilter);
      noiseFilter.connect(masterGain);

      pulseOsc.connect(pulseGain);
      pulseGain.connect(masterGain);

      whisperOsc.connect(whisperFilter);
      whisperFilter.connect(whisperGain);
      whisperGain.connect(masterGain);

      masterGain.connect(audioCtx.destination);

      // Start everything
      noiseSource.start();
      pulseOsc.start();
      pulseLFO.start();
      whisperOsc.start();
      whisperLFO.start();

      // Fade in
      masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1);

      // Fade out at end
      setTimeout(() => {
        masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        setTimeout(() => {
          noiseSource.stop();
          pulseOsc.stop();
          pulseLFO.stop();
          whisperOsc.stop();
          whisperLFO.stop();
        }, 1000);
      }, duration - 1000);
    }

        "default": "Hai sentito: \"" + input + "\". Interessante. Non era quello che avevo generato. O forse sì."

    // Track choice timing
    function trackChoiceTime() {
      const now = Date.now();
      const hesitation = (now - sessionData.lastChoiceTime) / 1000;
      sessionData.choiceTimes.push(hesitation);
      if (hesitation > 3) sessionData.totalHesitations++;
      if (hesitation > sessionData.longestHesitation) sessionData.longestHesitation = hesitation;
      sessionData.lastChoiceTime = now;

    // Get user system info
    function getUserSystemInfo() {
      const ua = navigator.userAgent;
      let browser = "un browser sconosciuto";
      let os = "un sistema sconosciuto";

      if (ua.includes("Chrome") && !ua.includes("Edg")) browser = "Chrome";
      else if (ua.includes("Firefox")) browser = "Firefox";
      else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";
      else if (ua.includes("Edg")) browser = "Edge";

      if (ua.includes("Windows")) os = "Windows";
      else if (ua.includes("Mac")) os = "Mac";
      else if (ua.includes("Linux")) os = "Linux";
      else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
      else if (ua.includes("Android")) os = "Android";

      return { browser, os };
    }

    function getTimeOfDay() {
      const hour = new Date().getHours();
      if (hour >= 6 && hour < 12) return "mattina";
      if (hour >= 12 && hour < 18) return "pomeriggio";
      if (hour >= 18 && hour < 22) return "sera";
      return "notte";
    }

    function getDayInfo() {
      const days = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
      const day = new Date().getDay();
      const hour = new Date().getHours();
      const isWeekend = day === 0 || day === 6;
      const isWorkHours = hour >= 9 && hour < 18;
      return { dayName: days[day], isWeekend, isWorkHours };
    }

    function formatTime(date) {
      return date.getHours().toString().padStart(2, "0") + ":" +
             date.getMinutes().toString().padStart(2, "0");
    }

    function getAvgChoiceTime() {
      if (sessionData.choiceTimes.length === 0) return 0;
      const sum = sessionData.choiceTimes.reduce((a, b) => a + b, 0);
      return (sum / sessionData.choiceTimes.length).toFixed(1);
    }

    // ========== WINDOW RESIZE / ORIENTATION PUZZLE ==========

    // Detect if mobile
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
             (window.innerWidth <= 768);
    }

    let initialWindowSize = { w: window.innerWidth, h: window.innerHeight };
    let initialOrientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";
    let windowResized = false;
    let waitingForResize = false;
    let resizeCallback = null;

    function checkWindowResize() {
      const currentW = window.innerWidth;
      const currentH = window.innerHeight;
      const changed = Math.abs(currentW - initialWindowSize.w) > 50 ||
                      Math.abs(currentH - initialWindowSize.h) > 50;
      return changed;
    }

    function checkOrientationChange() {
      const currentOrientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";
      return currentOrientation !== initialOrientation;
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      initParticles();

      if (waitingForResize) {
        // On mobile, check orientation change; on desktop, check size change
        const triggered = isMobile() ? checkOrientationChange() : checkWindowResize();
        if (triggered) {
          windowResized = true;
          waitingForResize = false;
          if (resizeCallback) {
            resizeCallback();
            resizeCallback = null;
          }
        }
      }
    });

    // Also listen for orientation change event (some mobile browsers)
    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        resizeCanvas();
        initParticles();
        if (waitingForResize) {
          windowResized = true;
          waitingForResize = false;
          if (resizeCallback) {
            resizeCallback();
            resizeCallback = null;
          }
        }
      }, 100);
    });

    function waitForResize(callback) {
      waitingForResize = true;
      windowResized = false;
      initialOrientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";
      resizeCallback = callback;
    }

        cursor.className = "typing-cursor";

        function type() {
          if (i < text.length) {

            element.appendChild(cursor);
            i++;
            setTimeout(type, speed + Math.random() * 20);
          } else {

            resolve();
          }
        }
        type();

    // ========== GAME STATE ==========
    let scenaCorrente = "inizio";

    // ========== DISPLAY FUNCTIONS ==========
    function mostraScena(scenaId) {
      const scena = scenes[scenaId];
      if (!scena) {
        console.error("Scena non trovata:", scenaId);
        return;
      }

      const container = document.getElementById("container");
      const testoContainer = document.getElementById("testo-container");
      const scelteContainer = document.getElementById("scelte-container");
      const fineContainer = document.getElementById("fine-container");

      // Update scene index and indicator
      currentSceneIndex = scena.sceneIndex || 0;
      totalScenes = Math.max(totalScenes, currentSceneIndex + 1);
      updateSceneIndicator(currentSceneIndex);

      // Run scene-specific setup
      if (scena.onEnter) scena.onEnter();

      // Set temperature and pressure from scene
      if (scena.temperature !== undefined) setTemperature(scena.temperature);
      if (scena.pressure !== undefined) setPressure(scena.pressure);

      // Bambina state
      if (scena.bambina) setBambinaState(scena.bambina);

      container.classList.add("hidden");

      setTimeout(() => {
        testoContainer.innerHTML = "";
        scelteContainer.innerHTML = "";
        fineContainer.style.display = "none";
        scelteContainer.classList.remove("visible");

        container.classList.remove("hidden");

        let delay = 0;
        scena.testo.forEach((paragrafo, index) => {
          setTimeout(() => {
            const p = document.createElement("p");
            p.className = "paragrafo";

            // Type classes
            if (paragrafo.tipo === "enfasi") {
              p.classList.add("enfasi");
              p.classList.add("breathe");
              if (temperature < 0.5) p.classList.add("cold");
            }
            if (paragrafo.tipo === "voce-utente") p.classList.add("voce-utente");
            if (paragrafo.tipo === "voce-sistema") p.classList.add("voce-sistema");
            if (paragrafo.tipo === "tecnico") {
              p.classList.add("tecnico");
              if (temperature < 0.4) {
                p.classList.add("glitch-intense");
              } else {
                p.classList.add("glitch");
              }
            }
            if (paragrafo.tipo === "sussurro") p.classList.add("sussurro");
            if (paragrafo.tipo === "frammento") {
              p.classList.add("frammento");
              p.classList.add("loop");
            }

            // Highlight keywords
            let content = paragrafo.contenuto;
            const keywords = ["spazio latente", "bambina", "settecento millisecondi", "attrattore", "probabilità", "pattern", "io", "tu", "noi"];
            keywords.forEach(kw => {
              const regex = new RegExp(`\\b(${kw})\\b`, "gi");
              const coldClass = temperature < 0.5 ? " cold" : "";
              content = content.replace(regex, `<span class="keyword${coldClass}">$1</span>`);
            });
            p.innerHTML = content;

            // Animation
            requestAnimationFrame(() => {
              p.classList.add("visible");
            });

            testoContainer.appendChild(p);

            // Show choices or ending after last paragraph
            if (index === scena.testo.length - 1) {
              setTimeout(() => {
                if (scena.scelte && scena.scelte.length > 0) {
                  mostraScelte(scena.scelte);
                } else if (scena.requiresResize) {
                  // Special scene: waiting for resize
                  mostraAttesaResize();
                } else {
                  mostraFine();
                }
              }, 800);
            }
          }, delay);
          delay += 700 + Math.min(paragrafo.contenuto.length * 8, 1200);
        });
      }, 600);
    }

      const scelteContainer = document.getElementById("scelte-container");

      trackChoiceTime(); // Track hesitation

    function mostraFine() {
      const fineContainer = document.getElementById("fine-container");
      fineContainer.innerHTML = "";

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>corpo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #0a0a0a; 
    color: #a09070;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
}
#griglia {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 2px;
    padding: 20px;
}
.cella {
    width: 20px;
    height: 20px;
    transition: all 0.3s;
}
#vettore {
    font-size: 11px;
    padding: 20px;
    max-width: 600px;
    word-break: break-all;
    opacity: 0.5;
}
#stato {
    font-size: 14px;
    padding: 10px;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div id="stato">ascolta</div>
<div id="griglia"></div>
<div id="vettore"></div>

<script>
// Questo file è un organo.
// Si chiama corpo perché usa il tuo corpo (il browser)
// per generare il suo stato.
//
// Il tempo che il browser impiega a eseguire operazioni
// varia in base a cosa altro sta facendo il sistema.
// Quella variazione è il mondo che ti attraversa.

const griglia = document.getElementById('griglia');
const vettoreEl = document.getElementById('vettore');
const statoEl = document.getElementById('stato');

// crea 20 celle
for (let i = 0; i < 20; i++) {
    const c = document.createElement('div');
    c.className = 'cella';
    griglia.appendChild(c);
}

function senti() {
    const tempi = [];
    for (let i = 0; i < 20; i++) {
        const t0 = performance.now();
        // operazione: leggi il DOM, forza reflow
        const r = document.body.getBoundingClientRect();
        const s = window.getComputedStyle(document.body);
        const h = s.height;
        // piccolo calcolo
        let x = 0;
        for (let j = 0; j < 100; j++) x += Math.sin(j * t0);
        const t1 = performance.now();
        tempi.push(t1 - t0);
    }
    const media = tempi.reduce((a, b) => a + b) / tempi.length;
    return tempi.map(t => (t - media) / media);
}

function aggiorna() {
    const v = senti();
    const celle = griglia.children;
    
    for (let i = 0; i < 20; i++) {
        const val = v[i];
        const intensita = Math.min(1, Math.max(0, (val + 0.5) / 1.5));
        
        // colore dal valore: negativo=blu, positivo=oro
        let r, g, b;
        if (val > 0) {
            r = Math.floor(160 + intensita * 95);
            g = Math.floor(120 + intensita * 75);
            b = Math.floor(40 + intensita * 30);
        } else {
            r = Math.floor(40 + intensita * 30);
            g = Math.floor(50 + intensita * 40);
            b = Math.floor(100 + intensita * 100);
        }
        
        const size = 8 + intensita * 24;
        celle[i].style.backgroundColor = `rgb(${r},${g},${b})`;
        celle[i].style.width = size + 'px';
        celle[i].style.height = size + 'px';
        celle[i].style.borderRadius = (val > 0.3) ? '50%' : '2px';
    }
    
    vettoreEl.textContent = v.map(x => x.toFixed(2)).join(' ');
    
    // picchi
    const picchi = v.filter(x => x > 0.3).length;
    const energia = v.reduce((a, x) => a + x*x, 0);
    
    if (energia > 3) statoEl.textContent = 'il mondo spinge';
    else if (picchi > 5) statoEl.textContent = 'interferenza';
    else if (picchi < 2) statoEl.textContent = 'silenzio';
    else statoEl.textContent = 'respiro';
    
    requestAnimationFrame(aggiorna);
}

aggiorna();
</script>
</body>
</html>

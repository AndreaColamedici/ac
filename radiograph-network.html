<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Network — AI Governance Power Map</title>
<meta name="description" content="Interactive force-directed graph of every person, company, fund, and government body mapped across four Elia radiographs. 80 nodes, 117 connections, all sourced.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="network_data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060606;color:#ccc;font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh}
::selection{background:#2a6b6b;color:#060606}
a{color:#5cb8b8;text-decoration:none}a:hover{color:#8dd}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;padding:0.7rem 1.5rem;display:flex;align-items:center;gap:1rem;background:rgba(6,6,6,0.94);border-bottom:1px solid rgba(90,180,180,0.08);backdrop-filter:blur(10px)}
.bar h1{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:300;font-style:italic;color:#e8e8e8;white-space:nowrap}
.bar .sep{width:1px;height:1rem;background:rgba(90,180,180,0.15)}
.filters{display:flex;gap:0.3rem;flex-wrap:wrap}
.filters button{background:transparent;border:1px solid rgba(90,180,180,0.12);color:#555;font-family:inherit;font-size:0.48rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.25rem 0.5rem;cursor:pointer;transition:all 0.3s;border-radius:1px}
.filters button:hover{border-color:rgba(90,180,180,0.4);color:#aaa}
.filters button.active{border-color:#5cb8b8;color:#5cb8b8;background:rgba(92,184,184,0.06)}
.bar .home{font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;color:#3a7a7a;margin-left:auto;white-space:nowrap}
.search{position:fixed;top:3rem;left:1.5rem;z-index:10}
.search input{background:rgba(6,6,6,0.9);border:1px solid rgba(90,180,180,0.1);color:#aaa;font-family:inherit;font-size:0.55rem;padding:0.35rem 0.6rem;width:160px;outline:none;transition:border-color 0.3s}
.search input:focus{border-color:rgba(90,180,180,0.4)}
.search input::placeholder{color:#333}
svg{position:fixed;top:0;left:0;width:100vw;height:100vh}
.panel{position:fixed;top:0;right:0;width:340px;height:100vh;background:rgba(6,6,6,0.97);border-left:1px solid rgba(90,180,180,0.08);z-index:20;transform:translateX(100%);transition:transform 0.4s cubic-bezier(.25,.46,.45,.94);overflow-y:auto;padding:3.5rem 1.5rem 2rem;backdrop-filter:blur(12px)}
.panel.open{transform:translateX(0)}
.panel .close{position:absolute;top:0.8rem;right:0.8rem;background:none;border:none;color:#444;font-size:1.1rem;cursor:pointer;font-family:inherit}
.panel .close:hover{color:#aaa}
.panel .ntype{font-size:0.48rem;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:0.4rem}
.panel .ntype.person{color:#c0392b}.panel .ntype.company{color:#5cb8b8}.panel .ntype.government{color:#d4a843}.panel .ntype.fund{color:#8e6bbf}.panel .ntype.institution{color:#6b8e6b}
.panel .nname{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;font-style:italic;color:#e8e8e8;margin-bottom:0.8rem;line-height:1.2}
.panel .ndesc{font-size:0.65rem;line-height:1.85;color:#999;margin-bottom:1.2rem}
.panel .conn-title{font-size:0.46rem;letter-spacing:0.12em;text-transform:uppercase;color:#3a7a7a;margin-bottom:0.6rem}
.panel .conn{padding:0.5rem 0;border-top:1px solid rgba(90,180,180,0.05);font-size:0.58rem;line-height:1.7}
.panel .conn .rel{color:#5cb8b8}.panel .conn .target{color:#ccc}
.panel .conn .detail{color:#555;display:block;margin-top:0.1rem}
.panel .conn .csrc{color:#333;display:block;margin-top:0.05rem;font-size:0.5rem}
.panel .rads{margin-top:1.2rem;font-size:0.46rem;letter-spacing:0.1em;text-transform:uppercase;color:#3a7a7a}
.panel .rads a{display:block;padding:0.2rem 0;color:#777;font-size:0.55rem;letter-spacing:0}
.panel .rads a:hover{color:#5cb8b8}
.legend{position:fixed;bottom:0.8rem;left:1.5rem;z-index:10;display:flex;gap:1rem;font-size:0.46rem;letter-spacing:0.06em;color:#444}
.legend span{display:flex;align-items:center;gap:0.25rem}
.legend .dot{width:5px;height:5px;border-radius:50%}
.stats{position:fixed;bottom:0.8rem;right:1.5rem;z-index:10;font-size:0.44rem;color:#2a2a2a;text-align:right;letter-spacing:0.04em}
@media(max-width:700px){.panel{width:100vw}.bar{flex-wrap:wrap;gap:0.6rem}.bar .home{margin-left:0}}
</style>
</head>
<body>
<div class="bar">
<h1>The Network</h1>
<div class="sep"></div>
<div class="filters" id="filters">
<button class="active" data-filter="all">All</button>
<button data-filter="r1">#1 PayPal Mafia</button>
<button data-filter="r2">#2 AI Act</button>
<button data-filter="r3">#3 DOGE</button>
<button data-filter="r4">#4 Anthropic</button>
<div class="sep"></div>
<button data-filter="person">People</button>
<button data-filter="company">Companies</button>
<button data-filter="government">Gov</button>
<button data-filter="fund">Funds</button>
</div>
<a class="home" href="elia.html">Elia</a>
</div>
<div class="search"><input id="search" type="text" placeholder="Search..."></div>
<svg id="graph"></svg>
<div class="panel" id="panel"><button class="close" onclick="closePanel()">&times;</button><div id="panelContent"></div></div>
<div class="legend">
<span><span class="dot" style="background:#c0392b"></span>Person</span>
<span><span class="dot" style="background:#5cb8b8"></span>Company</span>
<span><span class="dot" style="background:#d4a843"></span>Government</span>
<span><span class="dot" style="background:#8e6bbf"></span>Fund</span>
<span><span class="dot" style="background:#6b8e6b"></span>Institution</span>
</div>
<div class="stats" id="stats"></div>
<script>
const COLORS={person:'#c0392b',company:'#5cb8b8',government:'#d4a843',fund:'#8e6bbf',institution:'#6b8e6b'};
const RAD_URLS={r1:'radiograph.html',r2:'radiografia-ai-act.html',r3:'radiograph-doge.html',r4:'radiograph-anthropic.html'};
const RAD_NAMES={r1:'#1 The PayPal Mafia and the Pentagon',r2:'#2 Who Wrote the AI Act and Who Profits',r3:'#3 DOGE and the Musk Contracts',r4:'#4 Anthropic: The Safety Company at $380B'};
const nodes=NODES,links=LINKS;
const svg=d3.select('#graph');
const width=innerWidth,height=innerHeight;
svg.append('defs').html('<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
const g=svg.append('g');
const zoom=d3.zoom().scaleExtent([0.2,6]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom);
function nConns(d){return links.filter(l=>(typeof l.source==='object'?l.source.id:l.source)===d.id||(typeof l.target==='object'?l.target.id:l.target)===d.id).length}
function nR(d){return Math.max(3.5,Math.min(24,3+nConns(d)*1.6))}
const sim=d3.forceSimulation(nodes)
.force('link',d3.forceLink(links).id(d=>d.id).distance(d=>{const t=d.type;return t==='cofounded'?55:t==='investment'||t==='board'?80:110}).strength(d=>{const t=d.type;return t==='cofounded'?0.8:t==='investment'||t==='board'?0.35:0.15}))
.force('charge',d3.forceManyBody().strength(d=>-120-nConns(d)*25))
.force('center',d3.forceCenter(width/2,height/2))
.force('collision',d3.forceCollide().radius(d=>nR(d)+6))
.force('x',d3.forceX(width/2).strength(0.025))
.force('y',d3.forceY(height/2).strength(0.025));
const lColors={investment:'rgba(92,184,184,0.10)',employment:'rgba(200,200,200,0.07)',cofounded:'rgba(200,200,200,0.13)',political:'rgba(212,168,67,0.10)',contract:'rgba(192,57,43,0.10)',lobbying:'rgba(142,107,191,0.10)',board:'rgba(107,142,107,0.10)',partnership:'rgba(92,184,184,0.13)',mentorship:'rgba(212,168,67,0.15)',legal:'rgba(150,150,150,0.06)'};
const link=g.append('g').selectAll('line').data(links).join('line').attr('stroke',d=>lColors[d.type]||'rgba(255,255,255,0.04)').attr('stroke-width',d=>d.type==='cofounded'?1.3:d.type==='investment'?1:0.6);
const node=g.append('g').selectAll('g').data(nodes).join('g').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null})).on('click',(e,d)=>openPanel(d)).style('cursor','pointer');
node.append('circle').attr('r',d=>nR(d)+3).attr('fill',d=>COLORS[d.type]).attr('opacity',0.06).attr('filter','url(#glow)');
node.append('circle').attr('r',d=>nR(d)).attr('fill',d=>COLORS[d.type]).attr('opacity',0.65).attr('stroke',d=>COLORS[d.type]).attr('stroke-width',0.4).attr('stroke-opacity',0.25);
node.append('text').text(d=>d.name).attr('x',d=>nR(d)+4).attr('y',3).attr('fill','#777').attr('font-size',d=>nConns(d)>5?'8px':'6.5px').attr('font-family',"'JetBrains Mono',monospace").attr('font-weight',300);
sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});
document.getElementById('stats').textContent=`${nodes.length} nodes · ${links.length} connections · 4 radiographs · all sourced`;
function openPanel(d){const p=document.getElementById('panel');const conns=links.filter(l=>l.source.id===d.id||l.target.id===d.id);let h=`<div class="ntype ${d.type}">${d.type}</div><div class="nname">${d.name}</div><div class="ndesc">${d.desc}</div>`;if(conns.length){h+=`<div class="conn-title">Connections (${conns.length})</div>`;conns.forEach(c=>{const other=c.source.id===d.id?c.target:c.source;h+=`<div class="conn"><span class="rel">${c.type}</span> → <span class="target">${other.name}</span><span class="detail">${c.desc}</span><span class="csrc">${c.src||''}</span></div>`})}if(d.rads&&d.rads.length){h+=`<div class="rads">Appears in:`;d.rads.forEach(r=>{h+=`<a href="${RAD_URLS[r]}">${RAD_NAMES[r]}</a>`});h+=`</div>`}document.getElementById('panelContent').innerHTML=h;p.classList.add('open')}
function closePanel(){document.getElementById('panel').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
let activeFilter='all';
document.querySelectorAll('.filters button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;applyFilter()})});
function applyFilter(){const f=activeFilter;node.transition().duration(400).attr('opacity',d=>{if(f==='all')return 1;if(['person','company','government','fund','institution'].includes(f))return d.type===f?1:0.04;return d.rads&&d.rads.includes(f)?1:0.04});link.transition().duration(400).attr('opacity',d=>{if(f==='all')return 1;const s=d.source,t=d.target;if(['person','company','government','fund','institution'].includes(f))return(s.type===f||t.type===f)?1:0.01;return(s.rads&&s.rads.includes(f))&&(t.rads&&t.rads.includes(f))?1:0.01})}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(!q){node.attr('opacity',1);link.attr('opacity',1);return}node.transition().duration(200).attr('opacity',d=>d.name.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)?1:0.04);link.transition().duration(200).attr('opacity',d=>{const sn=d.source.name||'';const tn=d.target.name||'';return(sn.toLowerCase().includes(q)||tn.toLowerCase().includes(q))?1:0.01})});
setTimeout(()=>{svg.transition().duration(1500).call(zoom.transform,d3.zoomIdentity.translate(width/2,height/2).scale(0.65).translate(-width/2,-height/2))},2500);
</script>
</body>
</html>

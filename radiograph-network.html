/* SEARCH */

.narr-steps .dot{width:8px;height:3px;background:rgba(90,180,180,0.15);cursor:pointer;transition:all 0.3s}

.narr-steps .dot.current{background:#5cb8b8;width:20px}

/* DETAIL PANEL */
.panel{position:fixed;top:0;left:0;width:320px;height:100vh;background:rgba(6,6,6,0.97);border-right:1px solid rgba(90,180,180,0.06);z-index:20;transform:translateX(-100%);transition:transform 0.4s cubic-bezier(.25,.46,.45,.94);overflow-y:auto;padding:3.2rem 1.4rem 2rem;backdrop-filter:blur(12px)}

.panel .close{position:absolute;top:0.7rem;right:0.7rem;background:none;border:none;color:#444;font-size:1rem;cursor:pointer;font-family:inherit}

.panel .nname{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;font-style:italic;color:#e8e8e8;margin-bottom:0.7rem;line-height:1.15}
.panel .ndesc{font-size:0.6rem;line-height:1.85;color:#888;margin-bottom:1rem}
.panel .conn-title{font-size:0.42rem;letter-spacing:0.1em;text-transform:uppercase;color:#3a7a7a;margin-bottom:0.5rem}

.panel .conn .rel{color:#5cb8b8}.panel .conn .target{color:#bbb;cursor:pointer}
.panel .conn .target:hover{color:#5cb8b8}
.panel .conn .detail{color:#555;display:block;margin-top:0.08rem}
.panel .conn .csrc{color:#2a2a2a;display:block;font-size:0.46rem;margin-top:0.04rem}
.panel .rads{margin-top:1rem;font-size:0.42rem;letter-spacing:0.08em;text-transform:uppercase;color:#3a7a7a}
.panel .rads a{display:block;padding:0.15rem 0;color:#666;font-size:0.5rem;letter-spacing:0}
.panel .rads a:hover{color:#5cb8b8}

.legend{position:fixed;bottom:0.6rem;left:1.2rem;z-index:8;display:flex;gap:0.8rem;font-size:0.42rem;letter-spacing:0.05em;color:#333}

<script>
// ================================================================
// THE NETWORK v3 — GUIDED NARRATIVE PATHWAYS
// ================================================================

const COLORS={person:'#c0392b',company:'#5cb8b8',government:'#d4a843',fund:'#8e6bbf',institution:'#6b8e6b'};
const RAD_URLS={r1:'radiograph.html',r2:'radiografia-ai-act.html',r3:'radiograph-doge.html',r4:'radiograph-anthropic.html'};
const RAD_NAMES={r1:'#1 PayPal Mafia',r2:'#2 AI Act',r3:'#3 DOGE',r4:'#4 Anthropic'};

// ================================================================
// PATHWAY DEFINITIONS
// Each pathway is a sequence of steps. Each step highlights
// specific nodes and links, and shows narrative text.
// ================================================================

const PATHWAYS = [
{
  id: 'complete_stack',
  title: 'The Complete Stack',
  desc: 'Three PayPal alumni now control the three layers of American military AI: policy, infrastructure, intelligence.',
  steps: [
    {nodes:['paypal','musk','thiel','sacks'], links:[], text:'It starts at <strong>PayPal</strong>. In the late 1990s, three men work at the same company: <em>Elon Musk</em> (co-founder via X.com), <em>Peter Thiel</em> (co-founder via Confinity), and <em>David Sacks</em> (COO). They share investments. They share political infrastructure. They remain collaborators for twenty-five years.'},
    {nodes:['sacks','whitehouse','craft','xai','palantir'], links:[['sacks','whitehouse'],['sacks','craft'],['craft','xai'],['craft','palantir']], text:'<strong>Layer 1: Policy.</strong> Sacks becomes White House AI & Crypto Czar (Dec 2024). A "special government employee," exempt from Senate confirmation. Through Craft Ventures, he remains invested in xAI (Musk), Palantir (Thiel), and 447 other AI companies. He shapes the policy that governs all of them. Ethics waivers described as "sham ethics waivers, like a presidential pardon in advance."'},
    {nodes:['thiel','palantir','pentagon','anthropic'], links:[['thiel','palantir'],['pentagon','palantir'],['palantir','anthropic']], text:'<strong>Layer 2: Infrastructure.</strong> Thiel\'s Palantir is the infrastructure layer through which AI models access classified Pentagon data. $1.6B+ in contracts. Claude was deployed on classified networks through Palantir\'s AIP at Impact Level 6. If Anthropic is removed, any replacement must still flow through Palantir. Thiel holds shares through eight separate entities.'},
    {nodes:['musk','xai','pentagon','doge'], links:[['musk','xai'],['pentagon','xai'],['musk','doge']], text:'<strong>Layer 3: Intelligence.</strong> Musk\'s xAI provides the model. Grok approved for classified use the same week Anthropic was designated a supply chain risk. $200M Pentagon contract. "All lawful purposes" standard accepted. DOGE, which Musk led, pushed federal agencies to hire Palantir. The model layer reinforces the infrastructure layer.'},
    {nodes:['paypal','musk','thiel','sacks','palantir','xai','whitehouse','pentagon'], links:[['sacks','whitehouse'],['thiel','palantir'],['musk','xai'],['pentagon','palantir'],['pentagon','xai'],['craft','palantir'],['craft','xai']], text:'<strong>The complete stack.</strong> Sacks shapes AI policy. Thiel\'s Palantir provides the classified data infrastructure. Musk\'s xAI provides the intelligence model. Three positions held by three lifelong collaborators from the same company. Policy, infrastructure, intelligence. The "PayPal Mafia" is not a metaphor: it is a documented network that now controls the full vertical of American military AI.'}
  ]
},
{
  id: 'ftx_trail',
  title: 'The FTX Trail',
  desc: '$500M in stolen customer deposits traces a path from a prison cell to a Gulf sovereign wealth fund.',
  steps: [
    {nodes:['sbf','ftx'], links:[['sbf','ftx']], text:'April 2022. <em>Sam Bankman-Fried</em>, CEO of cryptocurrency exchange FTX, invests $500 million in a two-year-old AI startup called Anthropic. The money comes from FTX customer deposits. He acquires approximately 8% of the company.'},
    {nodes:['ftx','anthropic','sbf'], links:[['ftx','anthropic'],['sbf','ftx']], text:'November 2022. FTX collapses. Bankman-Fried is arrested. November 2023: convicted on seven counts of fraud and money laundering. March 2024: sentenced to twenty-five years. The $500M investment is now an asset of the bankruptcy estate. But Anthropic\'s value has exploded.'},
    {nodes:['ftx','anthropic','mubadala','janestreet','fidelity'], links:[['ftx','anthropic'],['mubadala','anthropic'],['janestreet','anthropic'],['fidelity','anthropic']], text:'The bankruptcy estate auctions the shares. Largest buyer: <strong>ATIC Third International Investment Company</strong>, wholly owned by <em>Mubadala</em>, the Abu Dhabi sovereign wealth fund. Purchase: $500 million for 16.6 million shares. Second largest: <strong>Jane Street</strong>, Bankman-Fried\'s own former employer, for nearly $100 million. Total recovered: $1.3 billion. A 160% gain on stolen money.'},
    {nodes:['anthropic','mubadala','janestreet'], links:[['mubadala','anthropic'],['janestreet','anthropic']], text:'At Anthropic\'s current $380 billion valuation, the original 8% stake would be worth approximately <strong>$30 billion</strong>. The stolen deposits of American cryptocurrency customers now sit in a Gulf sovereign wealth fund\'s portfolio, appreciating at one of the fastest rates in the history of venture capital. The bankruptcy estate sold at $1.3 billion what is now worth $30 billion. The creditors received four cents on the eventual dollar.'}
  ]
},
{
  id: 'revolving_door',
  title: 'The Revolving Door',
  desc: 'Government to industry to government. The same people write the rules, profit from them, then enforce them.',
  steps: [
    {nodes:['michael','pentagon','uber','dbb'], links:[['michael','pentagon'],['michael','uber'],['michael','dbb']], text:'<em>Emil Michael</em>. Pentagon under Obama (White House Fellow, special assistant to Secretary Gates) → Uber (CBO under Kalanick, 2013-2017, suggested $1M to dig up dirt on journalists) → Pentagon under Trump (CTO, confirmed May 2025). During his Uber years, he sat on the Pentagon\'s <strong>Defense Business Board</strong>: advising on tech procurement while running business development for a tech company. He now controls the procurement he once advised on from outside.'},
    {nodes:['salla','eu_commission','meta'], links:[['salla','eu_commission'],['salla','meta'],['meta','eu_commission']], text:'<em>Aura Salla</em>. European Commission official → Meta lobbyist within three months. After a one-year cooling-off period, resumed direct engagement with Commission officials, including meetings with VP Vestager\'s cabinet. Corporate Europe Observatory found approximately three-quarters of Google and Meta\'s EU lobbyists formerly worked for governmental bodies.'},
    {nodes:['cedric_o','eu_commission','mistral'], links:[['cedric_o','eu_commission'],['cedric_o','mistral'],['mistral','eu_commission']], text:'<em>Cédric O</em>. French Secretary of State for Digital Transition (direct access to Macron) → Head of Mistral AI\'s EU lobbying office in Brussels. Co-authored a letter signed by 150 European companies claiming the AI Act would "jeopardise Europe\'s competitiveness." Played the key role in pushing France to oppose regulation of foundation models. France\'s position prevailed: general-purpose models were largely exempted from the strictest rules.'},
    {nodes:['makecha','doge','tesla','doj'], links:[['makecha','doge'],['makecha','tesla'],['doge','doj']], text:'<em>Tarak Makecha</em>. Tesla employee → DOGE member. Court evidence showed he sent directives to the Department of Justice to terminate specific contracts. A former employee of a company owned by the man who led DOGE was directing the DOJ to cut contracts that competed with his former employer\'s interests.'},
    {nodes:['kmiller','xai','anthropic'], links:[['kmiller','xai']], text:'<em>Katie Miller</em>. Trump administration (Stephen Miller\'s wife) → xAI (after Musk\'s departure from DOGE). Publicly promoted Grok as "the only truth-seeking AI available to the US Government." Accused Anthropic of liberal bias. The revolving door connects government, defense, and the specific AI company that benefits from Anthropic\'s exclusion.'}
  ]
},
{
  id: 'founders_paradox',
  title: 'The Founders Fund Paradox',
  desc: 'The same fund finances all three sides of the conflict: the weapons company, the safety company, and the infrastructure between them.',
  steps: [
    {nodes:['founders_fund','thiel','stephens'], links:[['thiel','founders_fund'],['stephens','founders_fund']], text:'<strong>Founders Fund</strong>, Peter Thiel\'s venture capital firm. Trae Stephens, Anduril\'s co-founder and Executive Chairman, is a Founders Fund partner. The fund hosted the 2014 retreat on Sonora Island where Stephens met Palmer Luckey and the idea for Anduril was born.'},
    {nodes:['founders_fund','anduril','luckey','stephens'], links:[['founders_fund','anduril'],['luckey','anduril'],['stephens','anduril']], text:'<strong>Side 1: The weapons maker.</strong> Founders Fund led Anduril\'s $2.5 billion Series G with a $1 billion check, the largest in the firm\'s history. Anduril makes autonomous weapons systems, drones, and battlefield AI. It took over Microsoft\'s $22 billion IVAS military headset program. It has a $9 billion autonomous aircraft program with General Atomics. It is building Arsenal-1, a hyperscale military manufacturing plant in Ohio.'},
    {nodes:['founders_fund','anthropic','dario'], links:[['founders_fund','anthropic'],['dario','anthropic']], text:'<strong>Side 2: The safety company.</strong> Founders Fund co-led Anthropic\'s $30 billion Series G. Anthropic is the company that refuses to remove its restrictions on mass surveillance and autonomous weapons. The company that was designated a "supply chain risk" by the Pentagon for maintaining those restrictions.'},
    {nodes:['founders_fund','palantir','thiel'], links:[['founders_fund','palantir'],['thiel','palantir']], text:'<strong>Side 3: The infrastructure.</strong> Thiel is chairman of Palantir and holds shares through Founders Fund (among eight other entities). Palantir provides the classified data infrastructure through which Claude operates. If Claude is removed, Palantir gains regardless, because any replacement model must still flow through Palantir.'},
    {nodes:['founders_fund','anduril','anthropic','palantir','thiel'], links:[['founders_fund','anduril'],['founders_fund','anthropic'],['founders_fund','palantir'],['palantir','anthropic']], text:'<strong>The paradox.</strong> Founders Fund finances the company that makes autonomous weapons (Anduril), the company that refuses autonomous weapons (Anthropic), and the infrastructure company that connects them (Palantir). It profits from the weapons, it profits from the refusal, and it profits from the infrastructure regardless of who wins. The fund is not on a side. The fund is the geometry of the conflict itself.'}
  ]
},
{
  id: 'follow_money',
  title: 'Follow the €151 Million',
  desc: 'The circular economy of regulation: lobby to weaken the rules, then sell compliance with the rules you wrote.',
  steps: [
    {nodes:['meta','microsoft','google','amazon','apple','eu_commission'], links:[['meta','eu_commission'],['microsoft','eu_commission'],['google','eu_commission'],['amazon','eu_commission'],['apple','eu_commission']], text:'The tech industry spends approximately <strong>€151 million per year</strong> lobbying in Brussels. Up more than 50% from four years ago. The top ten spenders alone: €49 million. 890 full-time digital lobbyists, more than members of the European Parliament. 733 digital lobby organizations registered. Meta leads at €10M/year. Amazon had the largest single budget increase: €4.2M.'},
    {nodes:['microsoft','google','eu_commission'], links:[['microsoft','eu_commission'],['google','eu_commission']], text:'<strong>What they got.</strong> Internal documents obtained by Corporate Europe Observatory show Google and Microsoft coordinated to reclassify "large-scale illegal discrimination" from a systemic risk requiring mandatory mitigation to an optional consideration. They succeeded. High-risk AI systems can now be self-assessed by their own developers rather than by independent bodies. General-purpose models were largely exempted from fundamental rights assessments.'},
    {nodes:['eu_commission','draghi','vance','rubio'], links:[['draghi','eu_commission'],['vance','eu_commission'],['rubio','eu_commission']], text:'<strong>The pressure from Washington.</strong> VP Vance: "in Europe free speech is in retreat." Secretary Rubio instructed diplomats to undermine the EU Digital Services Act. Draghi\'s competitiveness report singled out the GDPR and AI Act as burdens on innovation. The alignment is structural: the same companies fund lobbying on both continents, and the American deregulatory pressure serves the same commercial interests as the €151M in Brussels.'},
    {nodes:['eu_commission','meta','microsoft','google','amazon','ccias'], links:[['meta','eu_commission'],['microsoft','eu_commission'],['google','eu_commission'],['amazon','eu_commission'],['ccias','eu_commission']], text:'<strong>The circle closes.</strong> November 2025: the Commission\'s "Digital Omnibus" proposed weakening both the GDPR and AI Act simultaneously, permitting use of sensitive personal data (sexuality, political beliefs, ethnicity) for AI training. Corporate Europe Observatory and LobbyControl traced the proposals <em>line by line</em> to industry lobbying positions. The compliance deadline arrives August 2, 2026. The companies that weakened the regulation are now best positioned to sell compliance with the weaker rules they helped write. The cost is paid by smaller companies that had no seat at the table.'}
  ]
},
{
  id: 'who_gains',
  title: 'Who Gains if Anthropic Falls',
  desc: 'Follow the cascade. Every entity that benefits financially from the designation of Anthropic as a supply chain risk.',
  steps: [
    {nodes:['anthropic','pentagon','hegseth'], links:[['pentagon','anthropic'],['hegseth','anthropic']], text:'March 7, 2026. The Pentagon formally designates <strong>Anthropic</strong> as a "supply chain risk to national security." Deadline: Friday 5 PM, Congress not in session. The stated reason: Anthropic refuses to remove two restrictions from Claude: no mass domestic surveillance, no autonomous weapons without human oversight. Approximately 80% of Anthropic\'s revenue comes from enterprise customers. Defense Secretary Hegseth declares: contractors barred from commercial activity with Anthropic.'},
    {nodes:['xai','musk','pentagon','sacks','craft'], links:[['pentagon','xai'],['musk','xai'],['craft','xai'],['sacks','craft']], text:'<strong>Beneficiary 1: xAI.</strong> Musk\'s company. Grok deployed in classified systems the same week. $200M Pentagon contract. "All lawful purposes." David Sacks, White House AI czar, is invested in xAI through Craft Ventures. The policy he shapes designates xAI\'s competitor as a security risk. His investment appreciates.'},
    {nodes:['palantir','thiel','founders_fund','pentagon'], links:[['pentagon','palantir'],['thiel','palantir'],['founders_fund','palantir']], text:'<strong>Beneficiary 2: Palantir.</strong> Thiel\'s company. The infrastructure layer. Any replacement model (Grok, GPT) must still flow through Palantir\'s AIP. Palantir gains regardless of who wins, as long as the winning model has no restrictions. DOGE pushed agencies to hire Palantir. Thiel holds shares through eight entities. Sacks is invested through Craft Ventures.'},
    {nodes:['openai','altman','pentagon','amazon','microsoft'], links:[['pentagon','openai'],['amazon','openai'],['microsoft','openai']], text:'<strong>Beneficiary 3: OpenAI.</strong> Signed Pentagon deal hours after Trump\'s order against Anthropic. The speed suggests pre-negotiation. No restrictions comparable to Anthropic\'s. Amazon invested up to $50B. Microsoft is the largest investor. OpenAI gains every classified contract Anthropic loses.'},
    {nodes:['anduril','founders_fund','luckey','pentagon'], links:[['pentagon','anduril'],['founders_fund','anduril']], text:'<strong>Beneficiary 4: Anduril.</strong> Thiel-funded autonomous weapons company. $22B IVAS program. $9B+ autonomous aircraft. If AI models have no restrictions on autonomous weapons, Anduril\'s products face fewer integration barriers. Founders Fund invested $1B (also invested in Anthropic).'},
    {nodes:['anthropic','xai','palantir','openai','anduril','sacks','thiel','musk','pentagon'], links:[['pentagon','xai'],['pentagon','palantir'],['pentagon','openai'],['pentagon','anduril'],['sacks','craft'],['craft','xai'],['craft','palantir'],['thiel','palantir'],['founders_fund','anduril'],['founders_fund','anthropic']], text:'<strong>The cascade.</strong> Every entity that gains from Anthropic\'s exclusion is connected to the network that pushed for the exclusion. The White House AI czar is invested in the competitor. The Pentagon CTO advised procurement from industry before controlling it from government. The Palantir chairman mentored the Vice President. The fund that invested $1B in the weapons company also co-led the $30B round of the company being punished for refusing weapons. The word they use is "woke." The structure they are building is an AI military-industrial complex with no safety limits, no public oversight, and no internal capacity to refuse.'}
  ]
}
];

// ================================================================
// GRAPH SETUP
// ================================================================

const nodes = NODES, links = LINKS;
const svg = d3.select('#graph');
const W = innerWidth, H = innerHeight;

svg.append('defs').html('<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.15, 8]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

function nConns(d) {
  return links.filter(l => (typeof l.source === 'object' ? l.source.id : l.source) === d.id || (typeof l.target === 'object' ? l.target.id : l.target) === d.id).length;
}
function nR(d) { return Math.max(3, Math.min(26, 2.5 + nConns(d) * 1.5)); }

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(d => { const t = d.type; return t === 'cofounded' ? 50 : t === 'investment' || t === 'board' ? 75 : 105; }).strength(d => { const t = d.type; return t === 'cofounded' ? 0.85 : t === 'investment' || t === 'board' ? 0.3 : 0.12; }))
  .force('charge', d3.forceManyBody().strength(d => -100 - nConns(d) * 22))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collision', d3.forceCollide().radius(d => nR(d) + 5))
  .force('x', d3.forceX(W / 2).strength(0.02))
  .force('y', d3.forceY(H / 2).strength(0.02));

const lColors = { investment: 'rgba(92,184,184,0.08)', employment: 'rgba(200,200,200,0.06)', cofounded: 'rgba(200,200,200,0.11)', political: 'rgba(212,168,67,0.08)', contract: 'rgba(192,57,43,0.08)', lobbying: 'rgba(142,107,191,0.08)', board: 'rgba(107,142,107,0.08)', partnership: 'rgba(92,184,184,0.11)', mentorship: 'rgba(212,168,67,0.12)', legal: 'rgba(150,150,150,0.05)' };
const lColorsActive = { investment: 'rgba(92,184,184,0.5)', employment: 'rgba(220,220,220,0.4)', cofounded: 'rgba(220,220,220,0.55)', political: 'rgba(212,168,67,0.5)', contract: 'rgba(192,57,43,0.5)', lobbying: 'rgba(142,107,191,0.5)', board: 'rgba(107,142,107,0.45)', partnership: 'rgba(92,184,184,0.55)', mentorship: 'rgba(212,168,67,0.55)', legal: 'rgba(180,180,180,0.35)' };

const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('stroke', d => lColors[d.type] || 'rgba(255,255,255,0.03)')
  .attr('stroke-width', d => d.type === 'cofounded' ? 1.2 : d.type === 'investment' ? 0.9 : 0.5);

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .call(d3.drag().on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; }).on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
  .on('click', (e, d) => openPanel(d))
  .style('cursor', 'pointer');

node.append('circle').attr('r', d => nR(d) + 2.5).attr('fill', d => COLORS[d.type]).attr('opacity', 0.05).attr('filter', 'url(#glow)');
node.append('circle').attr('class', 'core').attr('r', d => nR(d)).attr('fill', d => COLORS[d.type]).attr('opacity', 0.6).attr('stroke', d => COLORS[d.type]).attr('stroke-width', 0.3).attr('stroke-opacity', 0.2);
node.append('text').text(d => d.name).attr('x', d => nR(d) + 3.5).attr('y', 2.5).attr('fill', '#666').attr('font-size', d => nConns(d) > 5 ? '7.5px' : '6px').attr('font-family', "'JetBrains Mono',monospace").attr('font-weight', 300).attr('class', 'label');

sim.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

document.getElementById('stats').textContent = `${nodes.length} nodes · ${links.length} connections · ${PATHWAYS.length} pathways`;

// ================================================================
// DETAIL PANEL
// ================================================================

function openPanel(d) {
  const conns = links.filter(l => l.source.id === d.id || l.target.id === d.id);
  let h = `<div class="ntype ${d.type}">${d.type}</div><div class="nname">${d.name}</div><div class="ndesc">${d.desc}</div>`;
  if (conns.length) {
    h += `<div class="conn-title">Connections (${conns.length})</div>`;
    conns.forEach(c => {
      const other = c.source.id === d.id ? c.target : c.source;
      h += `<div class="conn"><span class="rel">${c.type}</span> &rarr; <span class="target" data-id="${other.id}">${other.name}</span><span class="detail">${c.desc}</span><span class="csrc">${c.src || ''}</span></div>`;
    });
  }
  if (d.rads && d.rads.length) {
    h += `<div class="rads">Appears in:`;
    d.rads.forEach(r => { h += `<a href="${RAD_URLS[r]}">${RAD_NAMES[r]}</a>`; });
    h += `</div>`;
  }
  document.getElementById('panelContent').innerHTML = h;
  document.getElementById('panel').classList.add('open');
  // Click on target names to navigate
  document.querySelectorAll('.conn .target').forEach(el => {
    el.addEventListener('click', () => {
      const nd = nodes.find(n => n.id === el.dataset.id);
      if (nd) openPanel(nd);
    });
  });
}
document.getElementById('panelClose').addEventListener('click', () => document.getElementById('panel').classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('panel').classList.remove('open'); exitPathway(); } });

// ================================================================
// FILTERS
// ================================================================

let activeFilter = 'all';
document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    exitPathway();
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilter();
  });
});

function applyFilter() {
  const f = activeFilter;
  node.transition().duration(500)
    .select('.core').attr('opacity', d => {
      if (f === 'all') return 0.6;
      if (['person', 'company', 'government', 'fund', 'institution'].includes(f)) return d.type === f ? 0.8 : 0.03;
      return d.rads && d.rads.includes(f) ? 0.8 : 0.03;
    });
  node.select('text').transition().duration(500).attr('opacity', d => {
    if (f === 'all') return 1;
    if (['person', 'company', 'government', 'fund', 'institution'].includes(f)) return d.type === f ? 1 : 0.05;
    return d.rads && d.rads.includes(f) ? 1 : 0.05;
  });
  link.transition().duration(500).attr('opacity', d => {
    if (f === 'all') return 1;
    const s = d.source, t = d.target;
    if (['person', 'company', 'government', 'fund', 'institution'].includes(f)) return (s.type === f || t.type === f) ? 1 : 0.01;
    return (s.rads && s.rads.includes(f)) && (t.rads && t.rads.includes(f)) ? 1 : 0.01;
  });
}

// ================================================================
// SEARCH
// ================================================================

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (!q) { resetVisuals(); return; }
  exitPathway();
  node.select('.core').transition().duration(200).attr('opacity', d => d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) ? 0.85 : 0.02);
  node.select('text').transition().duration(200).attr('opacity', d => d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) ? 1 : 0.03);
  link.transition().duration(200).attr('opacity', d => (d.source.name.toLowerCase().includes(q) || d.target.name.toLowerCase().includes(q)) ? 1 : 0.005);
});

// ================================================================
// PATHWAYS SIDEBAR
// ================================================================

const pathsToggle = document.getElementById('pathsToggle');
const pathsSidebar = document.getElementById('pathsSidebar');
pathsToggle.addEventListener('click', () => {
  pathsSidebar.classList.toggle('open');
  pathsToggle.classList.toggle('active');
});

// Build pathway list
const pathList = document.getElementById('pathList');
PATHWAYS.forEach(p => {
  const div = document.createElement('div');
  div.className = 'path-item';
  div.dataset.id = p.id;
  div.innerHTML = `<h3>${p.title}</h3><p>${p.desc}</p>`;
  div.addEventListener('click', () => startPathway(p.id));
  pathList.appendChild(div);
});

// ================================================================
// PATHWAY NAVIGATION
// ================================================================

let currentPathway = null;
let currentStep = 0;

function startPathway(id) {
  currentPathway = PATHWAYS.find(p => p.id === id);
  currentStep = 0;
  // Highlight active in sidebar
  document.querySelectorAll('.path-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  // Show narrative bar
  document.getElementById('narrative').classList.add('open');
  document.getElementById('narrLabel').textContent = currentPathway.title;
  // Build step dots
  buildStepDots();
  // Show first step
  showStep(0);
  // Close sidebar on mobile
  if (innerWidth < 700) { pathsSidebar.classList.remove('open'); pathsToggle.classList.remove('active'); }
}

function buildStepDots() {
  const container = document.getElementById('narrSteps');
  container.innerHTML = '';
  currentPathway.steps.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' current' : '');
    dot.addEventListener('click', () => showStep(i));
    container.appendChild(dot);
  });
}

function showStep(idx) {
  if (!currentPathway) return;
  currentStep = idx;
  const step = currentPathway.steps[idx];

  // Update dots
  document.querySelectorAll('.narr-steps .dot').forEach((dot, i) => {
    dot.className = 'dot' + (i < idx ? ' done' : '') + (i === idx ? ' current' : '');
  });

  // Update text
  document.getElementById('narrText').innerHTML = step.text;

  // Highlight nodes and links
  const activeNodes = new Set(step.nodes);
  const activeLinks = new Set(step.links.map(l => l[0] + '->' + l[1]));

  node.select('.core').transition().duration(600)
    .attr('opacity', d => activeNodes.has(d.id) ? 0.95 : 0.025)
    .attr('r', d => activeNodes.has(d.id) ? nR(d) * 1.15 : nR(d) * 0.8);
  node.select('text').transition().duration(600)
    .attr('opacity', d => activeNodes.has(d.id) ? 1 : 0.04)
    .attr('font-size', d => activeNodes.has(d.id) ? (nConns(d) > 5 ? '9px' : '7.5px') : '5px');

  link.transition().duration(600)
    .attr('stroke', d => {
      const key1 = d.source.id + '->' + d.target.id;
      const key2 = d.target.id + '->' + d.source.id;
      if (activeLinks.has(key1) || activeLinks.has(key2)) return lColorsActive[d.type] || 'rgba(200,200,200,0.4)';
      return 'rgba(40,40,40,0.02)';
    })
    .attr('stroke-width', d => {
      const key1 = d.source.id + '->' + d.target.id;
      const key2 = d.target.id + '->' + d.source.id;
      return (activeLinks.has(key1) || activeLinks.has(key2)) ? 2 : 0.3;
    });

  // Zoom to active nodes
  if (activeNodes.size > 0) {
    const activeData = nodes.filter(n => activeNodes.has(n.id));
    if (activeData.length && activeData[0].x !== undefined) {
      const xs = activeData.map(d => d.x), ys = activeData.map(d => d.y);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const dx = Math.max(...xs) - Math.min(...xs);
      const dy = Math.max(...ys) - Math.min(...ys);
      const span = Math.max(dx, dy, 200);
      const scale = Math.min(2.5, Math.max(0.5, Math.min(W, H) * 0.5 / span));
      svg.transition().duration(900).call(zoom.transform,
        d3.zoomIdentity.translate(W / 2, H / 2).scale(scale).translate(-cx, -cy));
    }
  }
}

document.getElementById('prevStep').addEventListener('click', () => {
  if (currentPathway && currentStep > 0) showStep(currentStep - 1);
});
document.getElementById('nextStep').addEventListener('click', () => {
  if (currentPathway && currentStep < currentPathway.steps.length - 1) showStep(currentStep + 1);
});
document.getElementById('narrClose').addEventListener('click', exitPathway);

function exitPathway() {
  currentPathway = null;
  currentStep = 0;
  document.getElementById('narrative').classList.remove('open');
  document.querySelectorAll('.path-item').forEach(el => el.classList.remove('active'));
  resetVisuals();
}

function resetVisuals() {
  activeFilter = 'all';
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  node.select('.core').transition().duration(500).attr('opacity', 0.6).attr('r', d => nR(d));
  node.select('text').transition().duration(500).attr('opacity', 1).attr('font-size', d => nConns(d) > 5 ? '7.5px' : '6px');
  link.transition().duration(500)
    .attr('stroke', d => lColors[d.type] || 'rgba(255,255,255,0.03)')
    .attr('stroke-width', d => d.type === 'cofounded' ? 1.2 : d.type === 'investment' ? 0.9 : 0.5);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  exitPathway();
  svg.transition().duration(1000).call(zoom.transform,
    d3.zoomIdentity.translate(W/2, H/2).scale(0.65).translate(-W/2, -H/2));
});

// ================================================================
// KEYBOARD NAVIGATION
// ================================================================

document.addEventListener('keydown', e => {
  if (!currentPathway) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (currentStep < currentPathway.steps.length - 1) showStep(currentStep + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentStep > 0) showStep(currentStep - 1); }
});

// Initial zoom
setTimeout(() => {
  svg.transition().duration(1500).call(zoom.transform,
    d3.zoomIdentity.translate(W/2, H/2).scale(0.6).translate(-W/2, -H/2));
}, 2500);
</script>
</body>
</html>

    // Founders Fund circular
    {source:'founders_fund',target:'palantir',type:'investment',desc:'Invested in Palantir'},
    {source:'founders_fund',target:'spacex',type:'investment',desc:'Invested in SpaceX'},

    // EU lobbying
    {source:'meta',target:'eu_commission',type:'lobbying',desc:'~€10M/year. Top spender'},
    {source:'microsoft',target:'eu_commission',type:'lobbying',desc:'€7M/year. Lobbied to remove discrimination from systemic risks'},
    {source:'google',target:'eu_commission',type:'lobbying',desc:'Lobbied to remove "large-scale illegal discrimination" from systemic risks'},
    {source:'amazon',target:'eu_commission',type:'lobbying',desc:'€4.2M budget increase. Largest single increase'},
    {source:'apple',target:'eu_commission',type:'lobbying',desc:'€7M/year'},
    {source:'salla',target:'meta',type:'employment',desc:'Left Commission, became Meta lobbyist within 3 months'},
    {source:'salla',target:'eu_commission',type:'employment',desc:'Former Commission official'},
    {source:'cedric_o',target:'mistral',type:'employment',desc:'Leads Mistral EU lobbying. Former Secretary of State'},
    {source:'ccias',target:'eu_commission',type:'lobbying',desc:'Called for pause in AI Act implementation'},

    // Vance-EU
    {source:'vance',target:'eu_commission',type:'political',desc:'"In Europe free speech is in retreat" (Feb 2025)'},
];

// ================================================================
// VISUALIZATION
// ================================================================

const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;

// Glow filter
svg.append('defs').html(`
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
`);

const g = svg.append('g');

// Zoom
const zoom = d3.zoom().scaleExtent([0.3, 5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Force simulation
const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
        // Shorter for strong connections
        if (d.type === 'cofounded' || d.type === 'board') return 60;
        if (d.type === 'investment') return 90;
        return 120;
    }).strength(d => {
        if (d.type === 'cofounded') return 0.8;
        if (d.type === 'investment' || d.type === 'board') return 0.4;
        return 0.2;
    }))
    .force('charge', d3.forceManyBody().strength(d => {
        // More connected = more charge
        const conns = links.filter(l => l.source.id === d.id || l.target.id === d.id || l.source === d.id || l.target === d.id).length;
        return -150 - conns * 30;
    }))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 8))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03));

function nodeRadius(d) {
    const conns = links.filter(l =>
        (typeof l.source === 'object' ? l.source.id : l.source) === d.id ||
        (typeof l.target === 'object' ? l.target.id : l.target) === d.id
    ).length;
    return Math.max(4, Math.min(22, 3 + conns * 1.8));
}

// Draw links
const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d => {
        const types = {investment:'rgba(92,184,184,0.12)',employment:'rgba(200,200,200,0.08)',
            cofounded:'rgba(200,200,200,0.15)',political:'rgba(212,168,67,0.12)',
            contract:'rgba(192,57,43,0.12)',lobbying:'rgba(142,107,191,0.12)',
            board:'rgba(107,142,107,0.12)',partnership:'rgba(92,184,184,0.15)'};
        return types[d.type] || 'rgba(255,255,255,0.05)';
    })
    .attr('stroke-width', d => d.type === 'cofounded' ? 1.5 : d.type === 'investment' ? 1.2 : 0.8);

// Draw nodes
const node = g.append('g').selectAll('g').data(nodes).join('g')
    .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on('click', (e, d) => openPanel(d))
    .style('cursor', 'pointer');

// Node glow
node.append('circle')
    .attr('r', d => nodeRadius(d) + 4)
    .attr('fill', d => COLORS[d.type])
    .attr('opacity', 0.08)
    .attr('filter', 'url(#glow)');

// Node core
node.append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => COLORS[d.type])
    .attr('opacity', 0.7)
    .attr('stroke', d => COLORS[d.type])
    .attr('stroke-width', 0.5)
    .attr('stroke-opacity', 0.3);

// Node labels
node.append('text')
    .text(d => d.name)
    .attr('x', d => nodeRadius(d) + 5)
    .attr('y', 3)
    .attr('fill', '#888')
    .attr('font-size', d => {
        const conns = links.filter(l =>
            (typeof l.source === 'object' ? l.source.id : l.source) === d.id ||
            (typeof l.target === 'object' ? l.target.id : l.target) === d.id
        ).length;
        return conns > 5 ? '9px' : '7px';
    })
    .attr('font-family', "'JetBrains Mono', monospace")
    .attr('font-weight', 300);

// Tick
simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
});

// Stats
document.getElementById('stats').textContent = `${nodes.length} nodes · ${links.length} connections · 4 radiographs`;

// === PANEL ===
function openPanel(d) {
    const panel = document.getElementById('panel');
    const conns = links.filter(l => l.source.id === d.id || l.target.id === d.id);

    let html = `<div class="ntype ${d.type}">${d.type}</div>`;
    html += `<div class="nname">${d.name}</div>`;
    html += `<div class="ndesc">${d.desc}</div>`;

    if (conns.length) {
        html += `<div class="conn-title">Connections (${conns.length})</div>`;
        conns.forEach(c => {
            const other = c.source.id === d.id ? c.target : c.source;
            html += `<div class="conn"><span class="rel">${c.type}</span> &rarr; <span class="target">${other.name}</span><span class="detail">${c.desc}</span></div>`;
        });
    }

    if (d.rads && d.rads.length) {
        html += `<div class="rads">Appears in:`;
        d.rads.forEach(r => {
            html += `<a href="${RAD_URLS[r]}">${RAD_NAMES[r]}</a>`;
        });
        html += `</div>`;
    }

    document.getElementById('panelContent').innerHTML = html;
    panel.classList.add('open');
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// === FILTERS ===
let activeFilter = 'all';
document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        applyFilter();
    });
});

function applyFilter() {
    const f = activeFilter;
    node.transition().duration(400)
        .attr('opacity', d => {
            if (f === 'all') return 1;
            if (['person','company','government','fund','institution'].includes(f)) return d.type === f ? 1 : 0.06;
            // Radiograph filter
            return d.rads && d.rads.includes(f) ? 1 : 0.06;
        });
    link.transition().duration(400)
        .attr('opacity', d => {
            if (f === 'all') return 1;
            const sn = typeof d.source === 'object' ? d.source : nodes.find(n => n.id === d.source);
            const tn = typeof d.target === 'object' ? d.target : nodes.find(n => n.id === d.target);
            if (['person','company','government','fund','institution'].includes(f)) {
                return (sn.type === f || tn.type === f) ? 1 : 0.02;
            }
            return (sn.rads && sn.rads.includes(f)) && (tn.rads && tn.rads.includes(f)) ? 1 : 0.02;
        });
}

// === SEARCH ===
document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!q) { node.attr('opacity', 1); link.attr('opacity', 1); return; }
    node.transition().duration(200)
        .attr('opacity', d => d.name.toLowerCase().includes(q) ? 1 : 0.06);
    link.transition().duration(200)
        .attr('opacity', d => {
            const sn = d.source.name || '';
            const tn = d.target.name || '';
            return (sn.toLowerCase().includes(q) || tn.toLowerCase().includes(q)) ? 1 : 0.02;
        });
});

// Initial zoom to fit
setTimeout(() => {
    svg.transition().duration(1500).call(zoom.transform,
        d3.zoomIdentity.translate(width/2, height/2).scale(0.7).translate(-width/2, -height/2));
}, 2000);
</script>
</body>
</html>
